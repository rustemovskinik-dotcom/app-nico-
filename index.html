      <div className={`pipe-card ${status}`}>
        <div className="pipe-head">
          <span className={`dot ${status}`}/>
          <span style={{flex:1}}>{label}</span>
          <span style={{color: status==="done" ? "var(--fuel)" : status==="error" ? "var(--body)" : "var(--focus)", display:"flex"}}>{right}</span>
        </div>
        <div style={{marginTop:6}}>{children}</div>
      </div>
    </>
  );
}
function SourceBadge({src, ai}){
  const m=SOURCE_META[src] || SOURCE_META.estimate;
  return <span className="src-badge" style={{"--c":m.color}}>{ai ? m.aiLabel : m.label}</span>;
}
const AI_HIDE_CODES=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","images_unavailable"];

function SnapMeal({state, dispatch, go, back}){
  const [phase,setPhase]=useState("capture");
  const [mode,setMode]=useState("demo");
  const [ai,setAi]=useState(null);
  const [aiChecked,setAiChecked]=useState(false);
  const [image,setImage]=useState(null);
  const [items,setItems]=useState([]);
  const [grams,setGrams]=useState([]);
  const [portion,setPortion]=useState("passt");
  const [oil,setOil]=useState(false);
  const [stage,setStage]=useState(0);
  const [shown,setShown]=useState(0);
  const [thinking,setThinking]=useState(false);
  const [liveNames,setLiveNames]=useState([]);
  const [error,setError]=useState(null);
  const [mealSlot,setMealSlot]=useState("MITTAG");
  const [saved,setSaved]=useState(false);
  const camRef=useRef(null), galRef=useRef(null);
  const timers=useRef([]);
  const ctlRef=useRef(null);
  const lastFile=useRef(null);

  useEffect(()=>{
    let alive=true;
    AI_READY.then(a=>{ if(alive){ setAi(a); setAiChecked(true); } });
    return ()=>{ alive=false; timers.current.forEach(clearTimeout); if(ctlRef.current) ctlRef.current.abort(); };
  },[]);

  function clearTimers(){ timers.current.forEach(clearTimeout); timers.current=[]; }
  function reset(){
    clearTimers();
    if(ctlRef.current){ ctlRef.current.abort(); ctlRef.current=null; }
    setThinking(false); setError(null); setPhase("capture"); setStage(0);
  }
  function begin(img){
    clearTimers(); setSaved(false); setError(null); setImage(img);
    setItems([]); setGrams([]); setLiveNames([]);
    setPhase("pipeline"); setStage(0); setShown(0);
  }
  function load(plate, fat){ setItems(plate); setGrams(plate.map(it=>it.grams)); setPortion("passt"); setOil(!!fat); }
  function animateFrom(startStage, count, delay){
    const at=(ms,fn)=>timers.current.push(setTimeout(fn,ms));
    let t=delay;
    for(let s=startStage; s<=3; s++){
      at(t,()=>{ setStage(s); setShown(0); }); t+=260;
      for(let i=1; i<=count; i++){ at(t,()=>setShown(i)); t+= s===1 ? 380 : 230; }
      t+=200;
    }
    at(t,()=>{ setStage(4); haptic(10); });
  }
  function runDemo(img, names){
    begin(img); setMode("demo");
    const plate=names.map(dbItem);
    load(plate, false);
    animateFrom(1, plate.length, 500);
  }
  async function runAi(file, previewUrl){
    begin(previewUrl); setMode("ai");
    setStage(1); setThinking(true);
    if(ctlRef.current) ctlRef.current.abort();
    const ctl=new AbortController(); ctlRef.current=ctl;
    try{
      const raw=await ai.sample.json(AI_PROMPT, {
        images:[file], signal:ctl.signal,
        onText:({text})=>{ setLiveNames([...text.matchAll(/"name"\s*:\s*"([^"]{1,40})"/g)].map(m=>m[1])); },
      });
      const res=sanitizeAi(raw);
      setThinking(false);
      if(!res.items.length){ setError({msg:"Kein Essen erkannt. Versuch ein anderes Foto.", retry:false}); return; }
      load(res.items, res.cookingFat);
      setShown(res.items.length);
      animateFrom(2, res.items.length, 450);
    }catch(e){
      setThinking(false);
      const code=e && e.code;
      if(code==="cancelled") return;
      if(AI_HIDE_CODES.includes(code)){
        setAi(null);
        setError({msg:"KI-Erkennung ist hier nicht freigegeben. Du kannst den Demo-Teller testen.", retry:false});
      }
      else if(code==="rate_limited") setError({msg:"Zu viele Anfragen oder dein Claude-Limit ist erreicht. Probier es später nochmal.", retry:true});
      else if(code==="image_rejected") setError({msg:"Dieses Bild geht leider nicht. Nimm ein normales Foto (JPG oder PNG).", retry:false});
      else if(code==="session_expired") setError({msg:"Bitte melde dich bei Claude neu an.", retry:false});
      else if(code==="refused") setError({msg:"Das Foto konnte nicht ausgewertet werden. Versuch ein anderes.", retry:false});
      else setError({msg:"Das hat nicht geklappt. Nochmal versuchen?", retry:true});
    }finally{
      if(ctlRef.current===ctl) ctlRef.current=null;
    }
  }
  function onFile(e){
    const file=e.target.files && e.target.files[0];
    e.target.value="";
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      if(ai){
        if(file.size>ai.limits.maxInputBytes){
          begin(reader.result); setMode("ai"); setStage(1);
          setError({msg:"Das Foto ist zu groß. Nimm ein kleineres Bild.", retry:false});
          return;
        }
        lastFile.current={file, url:reader.result};
        runAi(file, reader.result);
      } else {
        runDemo(reader.result, Math.random()<.5 ? DEMO_PLATE : ALT_PLATE);
      }
    };
    reader.readAsDataURL(file);
  }
  function retry(){ if(lastFile.current && ai) runAi(lastFile.current.file, lastFile.current.url); }
  function setAllPortions(p){ setPortion(p); setGrams(items.map(it=>round5(it.grams*PORTION_MULT[p]))); }
  function nudge(i, d){ setGrams(g=>g.map((v,j)=>j===i ? Math.max(5, v+d) : v)); }

  const n=items.length;
  const isAi=mode==="ai";
  const statusOf=(idx)=> error && stage===idx ? "error" : (stage>idx || stage===4) ? "done" : "active";
  const rowsFor=(idx)=> stage>idx ? n : stage===idx ? shown : 0;
  const ready=stage===4 && !error;
  const rows=nutritionRows(items, grams, oil);
  const total=sumRows(rows);
  const goal=state.fuel.kcalGoal||2600;
  const eaten=fuelTotals(state.fuel).kcal;
  const left=goal-eaten-total.kcal;
  const eatenPct=clamp(eaten/goal*100, 0, 100);
  const accept=ai ? ai.limits.mediaTypes.join(",") : "image/*";

  function save(){
    if(!ready || saved) return;
    haptic(15);
    dispatch({type:"LOG_MEAL", meal:{id:makeId("meal"), meal:mealSlot, kcal:total.kcal, protein:total.protein, carbs:total.carbs, fat:total.fat,
      items:rows.map(r=>`${r.name} ${r.g} g`)}});
    setSaved(true);
    setTimeout(()=>go("fuel"), 650);
  }

  return (
    <div className="screen">
      <input id="snap-camera" ref={camRef} type="file" accept={accept} capture="environment" hidden onChange={onFile}/>
      <input id="snap-gallery" ref={galRef} type="file" accept={accept} hidden onChange={onFile}/>
      <div className="stack">
        <SubHeader title="Snap Meal" onBack={back}/>

        {phase==="capture" && (
          <>
            <div className="snap-drop">
              <IconCamera size={34}/>
              <h2 className="t-title">Foto vom Teller.</h2>
              <p className="muted" style={{maxWidth:250, lineHeight:1.5, fontSize:14}}>Erkennen, Nährwerte, Portion. Dann siehst du Kalorien und Protein.</p>
              <span className="ai-status">
                <span className="dot" style={{background: !aiChecked ? "var(--faint)" : ai ? "var(--fuel)" : "var(--body)"}}/>
                {!aiChecked ? "Prüfe KI …" : ai ? "Echte KI-Erkennung aktiv" : "Demo-Modus · KI nur in der Claude-App"}
              </span>
            </div>
            <button className="cta press" onClick={()=>camRef.current.click()}>
              <span style={{display:"flex", alignItems:"center", gap:10}}><IconCamera size={18}/> Foto aufnehmen</span>
              <span className="arr"><IconArrow size={18}/></span>
            </button>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
              <button className="btn-soft press" style={{height:52}} onClick={()=>galRef.current.click()}>Aus Galerie</button>
              <button className="btn-soft press" style={{height:52}} onClick={()=>runDemo(DEMO_IMG, DEMO_PLATE)}>Demo-Teller</button>
            </div>
            {ai && <p className="fineprint">Beim ersten Foto fragt Claude, ob die App dein Claude-Kontingent nutzen darf.</p>}
          </>
        )}

        {phase==="pipeline" && (
          <div>
            <div className="photo">
              <img src={image} alt="Deine Mahlzeit"/>
              {stage<2 && !error && <div className="scan-line"/>}
              <span className="photo-badge">{isAi ? "FOTO · ECHTE KI" : "FOTO · DEMO"}</span>
            </div>

            {stage>=1 && (
              <PipeStage label="AI VISION" status={statusOf(1)}>
                {thinking ? (
                  <>
                    {liveNames.map((nm,i)=>(
                      <div key={i} className="pipe-row"><span>„{nm}“</span><span className="muted">…</span></div>
                    ))}
                    <div className="thinking">
                      <span>{liveNames.length ? "erkennt weiter …" : "Claude schaut sich dein Foto an …"}</span>
                      <button className="chip press" onClick={reset}>Stopp</button>
                    </div>
                  </>
                ) : items.slice(0, rowsFor(1)).map((it,i)=>(
                  <div key={i} className="pipe-row">
                    <span>„{it.name}“</span>
                    <span className="tabular muted" style={{fontSize:12}}>{it.conf}%</span>
                  </div>
                ))}
                {error && (
                  <div style={{paddingTop:6}}>
                    <p style={{color:"var(--body)", fontWeight:600, margin:"4px 0 12px", lineHeight:1.45}}>{error.msg}</p>
                    <div className="chips">
                      {error.retry && lastFile.current && ai && <button className="chip on press" onClick={retry}>Nochmal</button>}
                      <button className="chip press" onClick={reset}>Neues Foto</button>
                      {!ai && <button className="chip press" onClick={()=>runDemo(DEMO_IMG, DEMO_PLATE)}>Demo-Teller</button>}
                    </div>
                  </div>
                )}
              </PipeStage>
            )}

            {stage>=2 && (
              <PipeStage label="FOOD DATABASE" status={statusOf(2)}>
                {items.slice(0, rowsFor(2)).map((it,i)=>(
                  <div key={i} className="pipe-row">
                    <span style={{minWidth:0}}>{it.name} <span className="muted">→</span></span>
                    <SourceBadge src={it.src} ai={isAi}/>
                  </div>
                ))}
              </PipeStage>
            )}

            {stage>=3 && (
              <PipeStage label="PORTION ESTIMATE" status={statusOf(3)}>
                {items.slice(0, rowsFor(3)).map((it,i)=>(
                  <div key={i} className="pipe-row">
                    <span style={{minWidth:0}}>{it.name}</span>
                    <div className="stepper">
                      {ready && <button className="press" onClick={()=>nudge(i,-10)} disabled={grams[i]<=5} aria-label={`${it.name} weniger`}>−</button>}
                      <span className="tabular" style={{minWidth:64, textAlign:"center", fontWeight:700}}>≈ {grams[i]} g</span>
                      {ready && <button className="press" onClick={()=>nudge(i,10)} aria-label={`${it.name} mehr`}>+</button>}
                    </div>
                  </div>
                ))}
                {ready && oil && (
                  <div className="pipe-row">
                    <span>{OIL_ITEM.name}</span>
                    <span className="tabular" style={{fontWeight:700, color:"var(--fuel)"}}>≈ {OIL_ITEM.grams} g</span>
                  </div>
                )}
                {ready && (
                  <div style={{marginTop:10, display:"flex", flexDirection:"column", gap:8}}>
                    <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8}}>
                      {["kleiner","passt","groesser"].map(p=>(
                        <button key={p} className={`chip press ${portion===p ? "on" : ""}`} style={{justifyContent:"center"}} onClick={()=>setAllPortions(p)}>
                          {p==="kleiner" ? "Kleiner" : p==="passt" ? "Passt" : "Größer"}
                        </button>
                      ))}
                    </div>
                    <button className={`chip press ${oil ? "on" : ""}`} style={{justifyContent:"center"}} onClick={()=>setOil(o=>!o)} aria-pressed={oil}>
                      {oil ? "Mit Öl/Butter gebraten ✓" : "Mit Öl/Butter gebraten?"}
                    </button>
                  </div>
                )}
              </PipeStage>
            )}

            {ready && (
              <PipeStage label="RESULT" status="done">
                <div style={{paddingTop:8}}>
                  <div className="result-num"><span className="approx">≈</span><Odometer value={de(total.kcal)}/><small>KCAL</small></div>
                  <div className="result-pro"><span className="approx">≈</span><Odometer value={total.protein}/><span>g</span><small>PROTEIN</small></div>
                  <p className="muted" style={{fontSize:13, marginTop:12}}>Geschätzte Spanne: <b className="tabular" style={{color:"var(--ink)"}}>{de(total.min)} – {de(total.max)} kcal</b></p>
                  <div className="chips" style={{marginTop:12}}>
                    <span className="chip static tabular">{total.carbs} g Kohlenhydrate</span>
                    <span className="chip static tabular">{total.fat} g Fett</span>
                  </div>
                  <div className="budget" aria-hidden="true">
                    <i style={{width:`${eatenPct}%`, background:"var(--faint)"}}/>
                    <i style={{width:`${clamp(total.kcal/goal*100, 0, 100-eatenPct)}%`, background: left<0 ? "var(--body)" : "var(--fuel)"}}/>
                  </div>
                  <p className="tabular" style={{marginTop:10, fontWeight:700, color: left<0 ? "var(--body)" : "var(--fuel)"}}>
                    {left>=0 ? `Danach noch ${de(left)} kcal übrig` : `${de(Math.abs(left))} kcal über deinem Tagesziel`}
                  </p>
                  <p className="muted" style={{fontSize:12, marginTop:2}}>Tagesziel {de(goal)} kcal · schon gegessen {de(eaten)}</p>
                </div>
              </PipeStage>
            )}

            {ready && (
              <div style={{marginTop:22, display:"flex", flexDirection:"column", gap:12}}>
                <span className="label">Mahlzeit</span>
                <div style={{display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:8}}>
                  {MEAL_ORDER.map(m=>(
                    <button key={m} className={`chip press ${mealSlot===m ? "on" : ""}`} style={{justifyContent:"center"}} onClick={()=>setMealSlot(m)}>
                      {m.charAt(0)+m.slice(1).toLowerCase()}
                    </button>
                  ))}
                </div>
                <button className="btn-cta press" disabled={saved} onClick={save}>{saved ? "Gespeichert ✓" : "Zu heute speichern"}</button>
                <button className="btn-soft press" onClick={reset}>Neues Foto</button>
                <p className="fineprint">
                  {isAi
                    ? "Erkennung durch Claude. Nährwerte sind typische Werte aus Claudes Wissen (orientiert an USDA und Herstellerangaben), keine Live-Datenbankabfrage. Mengen mit − / + anpassen."
                    : "Demo: Die Erkennung ist simuliert. Mengen mit − / + anpassen."}
                </p>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function DigitalScreen({state, back}){
  const d=state.digital;
  const native=d.source==="native";
  const created=(state.focusLog || []).filter(f=>f.date===state.todayISO).reduce((a,f)=>a+(f.minutes || 0),0);
  const create = native ? d.createMin : created;
  const consume = d.consumeMin;
  const total=Math.max(1, consume+create);
  return (
    <div className="screen">
      <div className="stack">
        <SubHeader title="Digital" onBack={back}/>
        {!native && <p className="note">Konsum-Werte sind Beispielwerte. Echte Bildschirmzeit kommt erst mit der iPhone-App (Screen Time). „Erstellt / gelernt“ zählt schon jetzt deine echten Fokus-Sessions.</p>}
        <div className="digital-split">
          <div>
            <div className="label">Konsum{!native && " · Beispiel"}</div>
            <div className="big-dur tabular">{fmtDur(consume)}</div>
          </div>
          <div>
            <div className="label" style={{color:"var(--focus)"}}>Erstellt / gelernt</div>
            <div className="big-dur tabular" style={{color:"var(--focus)"}}>{fmtDur(create)}</div>
          </div>
        </div>
        <div className="budget" aria-hidden="true">

        </div>
        <p className="muted" style={{fontSize:14, lineHeight:1.5}}>
          {create>=consume ? "Heute mehr erschaffen als konsumiert." : `Noch ${fmtDur(consume-create)} bis Gleichstand. Kein Urteil, nur ein Blick drauf.`}
        </p>
        <div>
          <div className="section-head"><span className="label">Apps{!native && " · Beispiel"}</span><span className="label" style={{color:"var(--faint)"}}>{fmtDur(d.screenTimeMin)} gesamt</span></div>
          {(d.apps || []).map(a=>(
            <div key={a.name} className="wait-row"><span style={{fontWeight:600}}>{a.name}</span><span className="tabular muted">{fmtDur(a.minutes)}</span></div>
          ))}
        </div>
      </div>
    </div>
  );
}

        <div className="xp-chart" role="img" aria-label="XP der letzten sieben Tage">
          {days.map((x,k)=>(
            <div key={x.d} className={`xp-col ${x.today ? "today" : ""}`}>
              <b className="tabular">{x.xp || "–"}</b>
              <i style={{height:`${x.xp ? clamp(x.xp/max*100, 4, 100) : 2}%`, "--i":k}}/>

            </div>
          ))}
        </div>
      </div>
      <div>
        <div className="section-head"><span className="label">So sammelst du XP</span></div>

      </div>
    </AnimatedPage>
  );
}

function SettingsScreen({state, back, themePref, changeTheme}){
  const idx=Math.max(0, THEME_OPTS.findIndex(o=>o.id===themePref));

function planLines(plan){
  const out=plan.items.map(i=>{
    const t=`${hhmm(i.start)}–${hhmm(i.end)}`;
    if(i.kind==="free") return `  ${t} frei (${fmtDur(minsBetween(i.start,i.end))})`;
    const kind={lesson:"Schule", freistunde:"Freistunde", event:"Termin", gym:"Gym", task:"Aufgabe", block:"eingeplant"}[i.kind];
    return `  ${t} ${kind}: ${i.title}${i.sub ? ` (${i.sub})` : ""}${i.event ? ` [event_id ${i.event.id}]` : ""}`;
  });
  if(plan.allDay.length) out.push(`  ganztägig: ${plan.allDay.map(e=>`${e.title} [event_id ${e.id}]`).join(", ")}`);
  return out.join("\n") || "  (nichts)";
}
function dayCtx(env, day, title){

    `Schule: ${p.schoolStart ? `${hhmm(p.schoolStart)}–${hhmm(p.schoolEnd)}` : "keine"}${p.changes.length ? ` · Änderungen: ${p.changes.map(l=>`${l.subject} ${l.change==="cancelled" ? "fällt aus" : `Raum ${l.room}`}`).join(", ")}` : ""}\n`+
    `Freie Zeit: ${fmtDur(p.freeRemaining)}${p.freeDelta>0 ? ` (+${fmtDur(p.freeDelta)} durch Ausfall)` : ""}\n${planLines(p)}`;
}

function makeAITools(api, receipts, max){

    if(!q) return null;

    {name:"get_context", description:"Liefert Nicos aktuelle Daten zu einem Thema als Text. Themen: today, tomorrow, week, tasks, gym, fuel, skills, projects, calendar, history, digital. Mit topic=day und date=YYYY-MM-DD den Plan eines bestimmten Tages.",
      inputSchema:{type:"object", properties:{topic:{type:"string"}, date:{type:"string", description:"YYYY-MM-DD, nur für topic=day"}}, required:["topic"]},
      execute(input){
        const env=api.env();

        if(topic==="day"){ if(!ISO_RE.test(str(input.date))) throw new Error("date fehlt oder ist ungültig"); return dayCtx(env, dateFromISO(input.date), "Tag"); }
        const f=AI_TOPICS[topic];

      inputSchema:{type:"object", properties:{title:{type:"string"}, date:{type:"string"}, due:{type:"string"}, time:{type:"string"}, minutes:{type:"number"}, area:{type:"string", enum:["focus","body","future","school"]}}, required:["title"]},
      execute(input){
        const title=str(input.title).trim().slice(0,120);

    {name:"complete_task", description:"Markiert eine Aufgabe als erledigt. match = Titel oder Teil davon oder task_id. Für Gym: match='gym'. Für die Future Quest: match='quest'.",

    {name:"update_task", description:"Ändert oder verschiebt eine Aufgabe (Tag, Deadline, Uhrzeit, Titel, Dauer).",

    {name:"add_event", description:"Trägt einen Termin ein (NICO OS und, wenn verbunden, Google Kalender). date=YYYY-MM-DD, start=HH:MM, end oder minutes optional (Standard 60 Min.). Für ganztägig allDay=true.",

    {name:"update_event", description:"Verschiebt oder ändert einen Termin. Nutze event_id aus dem Kontext oder match (Titel).",

    {name:"plan_gym", description:"Plant Gym an einem Tag: time=HH:MM setzt die Uhrzeit, skip=true heißt kein Gym an dem Tag, reset=true zurück auf Standard, done=true markiert das heutige Training als erledigt. 'Nach der Schule' = Schulende des Tages als time.",

    {name:"school_change", description:"Trägt eine Stundenplanänderung ein: change=cancelled (fällt aus), room (Raumänderung, room angeben) oder restore (zurücksetzen). subject = Fach, z. B. Englisch. Gibt die neue freie Zeit zurück.",

        if(!ls.length) throw new Error("An dem Tag gibt es diese Stunde nicht.");

    {name:"log_meal", description:"Trägt eine Mahlzeit in Fuel ein. Werte sind Schätzungen. Nur mit confirmed=true, nachdem Nico die Werte bestätigt hat.",

    {name:"set_routine", description:"Ändert Nicos Standard-Routine: gymMin, noDiscMin, skillMin (Minuten), gymTime, dayStart, dayEnd (HH:MM).",

function nextGymDay(state, from){
  for(let i=1;i<=7;i++){ const d=addDays(startOfDay(from), i); const g=state.body.gym.find(x=>x.day===WEEKDAY_CODE[d.getDay()]); if(g && g.type!=="RUHE") return {d, g}; }
  return null;
}
function localAnswer(kind, env){
  const {state, now, plan}=env;
  const items=plan.items;
  const cur=items.find(i=>i.kind!=="free" && !i.cancelled && now>=i.start && now<i.end);
  const next=items.find(i=>i.kind!=="free" && !i.cancelled && i.start>now);
  const freeNow=items.find(i=>i.kind==="free" && now>=i.start && now<i.end);
  const block=items.find(i=>i.kind==="block" && i.start>=now);
  if(kind==="now"){
    const L=[];
    if(cur) L.push(`Jetzt: ${cur.title} bis ${hhmm(cur.end)}${cur.kind==="lesson" && cur.lesson.room ? ` (Raum ${cur.lesson.room})` : ""}.`);
    else if(freeNow) L.push(endDot(`Jetzt bist du frei, noch ${fmtDur(minsBetween(now, freeNow.end))}`));
    else L.push("Gerade steht nichts Festes an.");
    if(block && (!cur || cur.kind==="block")) L.push(`${blockName(block)} (${fmtDur(minsBetween(block.start, block.end))}) passt ${minsBetween(now, block.start)<5 ? "jetzt" : `um ${hhmm(block.start)}`} rein.`);
    if(next) L.push(`Als Nächstes: ${next.title} um ${hhmm(next.start)}.`);
    L.push(`Heute noch ${fmtDur(plan.freeRemaining)} frei.`);
    return L.join("\n");
  }
  if(kind==="today"){
    const rows=items.filter(i=>i.kind!=="free" && i.kind!=="freistunde").map(i=>`• ${hhmm(i.start)} ${i.title}${i.cancelled ? " – fällt aus" : ""}${i.suggested ? " (eingeplant)" : ""}`);
    const open=openTasksToday(state).filter(q=>!q.time);
    return [
      plan.schoolStart ? `Schule ${hhmm(plan.schoolStart)}–${hhmm(plan.schoolEnd)}${plan.changes.length ? `, ${plan.changes.length} Änderung${plan.changes.length>1 ? "en" : ""}` : ""}.` : "Heute keine Schule.",
      rows.length ? rows.join("\n") : "",
      open.length ? `Offen ohne Uhrzeit: ${open.map(q=>q.title).join(", ")}.` : "",
      endDot(`Freie Zeit heute noch: ${fmtDur(plan.freeRemaining)}`),
    ].filter(Boolean).join("\n");
  }
  if(kind==="free"){
    if(!plan.gaps.length) return "Heute ist keine freie Zeit mehr übrig.";
    return [`Noch ${fmtDur(plan.freeRemaining)} frei:`, ...plan.gaps.map(g=>`• ${hhmm(g.start)}–${hhmm(g.end)} (${fmtDur(minsBetween(g.start,g.end))})`),
      plan.freeDelta>0 ? `Davon +${fmtDur(plan.freeDelta)} durch Ausfall.` : ""].filter(Boolean).join("\n");
  }
  if(kind==="gym"){
    const g=plan.gymDay;
    if(!g || g.type==="RUHE"){ const n=nextGymDay(state, now); return `Heute ist Ruhetag.${n ? ` Nächstes Training: ${WEEKDAYS[n.d.getDay()]}, ${cap(n.g.type)}.` : ""}`; }
    if(g.done) return `${cap(g.type)} ist heute schon erledigt. Stark.`;
    if(plan.gymEvent) return `${cap(g.type)} steht um ${hhmm(plan.gymEvent.start)} in deinem Kalender.`;
    if(!plan.gymBlock) return `Heute ${cap(g.type)} – aber für heute ausgelassen.`;
    const b=plan.gymBlock;
    const until=minsBetween(now, b.start);
    const L=[`Heute ${cap(g.type)} um ${hhmm(b.start)} bis ${hhmm(b.end)} (${fmtDur(plan.R.gymMin)}).${b.moved ? " Ich hab es verschoben, weil vorher etwas anderes ist." : ""}`];
    if(until>0){
      L.push(endDot(`Bis dahin noch ${fmtDur(until)}`));
      const pre=items.filter(i=>i.kind==="block" && i.end<=b.start && i.start>=now);
      if(pre.length) L.push(`${pre.map(blockName).join(" und ")} ${pre.length>1 ? "passen" : "passt"} vorher noch rein.`);
    } else if(now<b.end) L.push("Das Training läuft gerade.");
    return L.join("\n");
  }
  if(kind==="tasks"){
    const open=state.queue.filter(q=>!q.done && q.kind!=="gym");
    if(!open.length) return "Keine offenen Aufgaben. Alles erledigt.";
    return [`${open.length} offen:`, ...open.map(q=>`• ${q.title}${q.date && q.date!==state.todayISO ? ` (${q.date.slice(8,10)}.${q.date.slice(5,7)}.)` : ""}${q.due ? ` · bis ${q.due.slice(8,10)}.${q.due.slice(5,7)}.` : ""}${q.time ? ` · ${q.time}` : ""}`)].join("\n");
  }
  if(kind==="tomorrow"){
    const d=addDays(startOfDay(now),1);
    const p=dayPlan(state, d, env.events, now);
    const rows=p.items.filter(i=>i.kind!=="free" && i.kind!=="lesson" && i.kind!=="freistunde").map(i=>`• ${hhmm(i.start)} ${i.title}`);
    return [`Morgen (${WEEKDAYS[d.getDay()]}, ${weekType(d)}-Woche):`,
      p.schoolStart ? `Schule ${hhmm(p.schoolStart)}–${hhmm(p.schoolEnd)}` : "Keine Schule", ...rows, `Frei: ${fmtDur(p.freeRemaining)}`].join("\n");
  }
  return "";
}

function makeThumb(file){
  return new Promise(res=>{
    try{
      const url=URL.createObjectURL(file);
      const img=new Image();
      img.onload=()=>{
        try{
          const s=Math.min(1, 280/Math.max(img.width, img.height));
          const c=document.createElement("canvas");
          c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", .7));
        }catch(e){ res(null); }
        URL.revokeObjectURL(url);
      };
      img.onerror=()=>{ URL.revokeObjectURL(url); res(null); };
      img.src=url;
    }catch(e){ res(null); }
  });
}

function useNicoAI({stateRef, apply, envRef, createEvent, updateEvent, removeEvent}){
  const [ai,setAi]=useState(null);
  const [checked,setChecked]=useState(false);
  const [busy,setBusy]=useState(false);
  const ctl=useRef(null);
  useEffect(()=>{ let alive=true; SAMPLE_READY.then(a=>{ if(alive){ setAi(a); setChecked(true); } }); return ()=>{ alive=false; if(ctl.current) ctl.current.abort(); }; },[]);

  function add(role, patch){ const m={id:makeId("m"), role, ts:Date.now(), text:"", ...patch}; apply({type:"AI_ADD", message:m}); return m.id; }
  function quick(kind, label){
    add("user", {text:label});
    if(kind==="tomorrow" && ai){
      return send({text:"Plan meinen Tag morgen: Wann ist Schule vorbei, wann passt Gym (2 Std.), No Disc (30 Min.) und eine Skill-Session (15 Min.)? Trag Gym direkt passend ein und nenn mir den Plan kurz.", silentUser:true, topics:["tomorrow","tasks","gym","week"]});
    }
    add("assistant", {text:localAnswer(kind, envRef.current), local:true});
  }
  async function send({text, file, silentUser, topics}){
    const clean=String(text || "").trim();
    if(!clean && !file) return;
    if(!silentUser){
      const thumb=file ? await makeThumb(file) : null;
      add("user", {text:clean, image:thumb, hasImage:!!file});
    }
    const botId=add("assistant", {pending:true});
    if(!ai){
      apply({type:"AI_UPDATE", id:botId, patch:{pending:false, error:true,
        text:"Für freie Fragen und Aktionen braucht NICO AI Claude – öffne NICO OS dafür in der Claude-App. Die Schnellaktionen oben funktionieren trotzdem."}});
      return;
    }
    if(file && !ai.images){
      apply({type:"AI_UPDATE", id:botId, patch:{pending:false, error:true, text:AI_ERRORS.images_unavailable}});
      return;
    }
    const env=envRef.current;
    const st=stateRef.current;
    const tp=Array.from(new Set(["today", ...(topics || routeTopics(`${clean} ${file ? "foto" : ""}`))]));
    const context=tp.map(k=>AI_TOPICS[k] ? AI_TOPICS[k](env) : "").filter(Boolean).join("\n\n");
    const snapshot=`Jetzt: ${WEEKDAYS[env.now.getDay()]}, ${todayISO(env.now)}, ${hhmm(env.now)} Uhr, KW ${isoWeek(env.now)} (${weekType(env.now)}-Woche). Schritte heute: ${env.steps.value}. ${env.weather && env.weather.data ? `Wetter ${WEATHER_LOC.name}: ${weatherLabel(env.weather.data)}, max ${env.weather.data.max}°, Regen ${env.weather.data.rain}%.` : ""}`;
    const history=st.ai.messages.filter(m=>!m.pending && !m.error && m.id!==botId && m.text).slice(-13, -1)
      .map(m=>({role:m.role, content:`${m.hasImage ? "[Foto] " : ""}${m.text}`.slice(0, 1500)}));
    const last=`${file ? "[Nico hat ein Foto angehängt.] " : ""}${clean || "Was ist auf dem Foto und was kann ich damit in NICO OS machen?"}`;
    const turns=[{role:"user", content:`${AI_RULES}\n\n=== NICO ===\n${profileCtx(st)}\n\n=== JETZT ===\n${snapshot}\n\n=== KONTEXT ===\n${context}`}, ...history, {role:"user", content:last}];
    const receipts=[];
    const api={get:()=>stateRef.current, apply, env:()=>({...envRef.current, state:stateRef.current}), createEvent, updateEvent, removeEvent};
    const tools=makeAITools(api, receipts, ai.tools);
    const deep=!!file || /plan|woche|lief|warum|analys|tipps|wie kann|vergleich/i.test(clean);
    const opts={modelTier: deep ? "default" : "quick", onText:({text:t})=>apply({type:"AI_UPDATE", id:botId, patch:{text:cleanAI(t)}})};
    if(tools.length) opts.tools=tools; else opts.cache=false;
    if(file) opts.images=[file];
    const c=new AbortController(); ctl.current=c; opts.signal=c.signal;
    setBusy(true);
    try{
      const r=await ai.sample(turns, opts);
      apply({type:"AI_UPDATE", id:botId, patch:{pending:false, text:cleanAI(r.text), actions:receipts.slice(), truncated:r.truncated}});
      if(receipts.length) haptic(12);
    }catch(e){
      const code=e && e.code;
      const partial=e && e.text ? cleanAI(e.text) : "";
      if(code==="cancelled") apply({type:"AI_UPDATE", id:botId, patch:{pending:false, text:partial || "Gestoppt.", actions:receipts.slice()}});
      else {
        if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) setAi(null);
        apply({type:"AI_UPDATE", id:botId, patch:{pending:false, error:!partial, actions:receipts.slice(),
          text: partial ? `${partial}\n\n(${AI_ERRORS[code] || "Unterbrochen."})` : (AI_ERRORS[code] || "Das hat gerade nicht geklappt. Versuch es nochmal.")}});
      }
    }finally{
      setBusy(false);
      if(ctl.current===c) ctl.current=null;
    }
  }
  function stop(){ if(ctl.current) ctl.current.abort(); }
  return {ai, checked, busy, send, quick, stop};
}

const SpeechRec = typeof window!=="undefined" ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
function useSpeech(onText){
  const [on,setOn]=useState(false);
  const [err,setErr]=useState("");
  const rec=useRef(null);
  useEffect(()=>()=>{ try{ rec.current && rec.current.abort(); }catch(e){} },[]);
  function start(prefix){
    if(!SpeechRec){ setErr("Spracheingabe geht hier nicht. Nutz das Mikrofon auf deiner Tastatur."); return; }
    try{
      const r=new SpeechRec();
      r.lang="de-DE"; r.interimResults=true; r.continuous=false;
      r.onresult=e=>{ let t=""; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript; onText(`${prefix ? `${prefix} ` : ""}${t}`); };
      r.onerror=e=>{ setErr(e.error==="not-allowed" || e.error==="service-not-allowed" ? "Mikrofon ist hier nicht erlaubt. Nutz das Mikrofon auf deiner Tastatur." : e.error==="no-speech" ? "Nichts gehört. Nochmal?" : "Spracheingabe hat nicht geklappt."); setOn(false); };
      r.onend=()=>setOn(false);
      rec.current=r; r.start(); setOn(true); setErr(""); haptic(8);
    }catch(e){ setErr("Spracheingabe hat nicht geklappt."); setOn(false); }
  }
  function stop(){ try{ rec.current && rec.current.stop(); }catch(e){} setOn(false); }
  return {on, err, start, stop};
}

function App(){
  const [state, dispatch]=useReducer(reducer, undefined, init);
  const stateRef=useRef(state);
  stateRef.current=state;
  const apply=useCallback(action=>{ stateRef.current=reducer(stateRef.current, action); dispatch(action); },[]);
  const [screen, setScreen]=useState({name:"heute", id:null});
  const [themePref, setThemePref]=useState(loadThemePref);
  const [theme, setTheme]=useState(resolvedTheme);
  const [addSheet, setAddSheet]=useState(null);
  const [toast, setToast]=useState(null);
  const [now, setNow]=useState(()=>new Date());
  const toastTimer=useRef(null);
  const prevProfile=useRef(state.profile);
  const history=useRef([]);
  const [vtNav, setVtNav]=useState(false);
  const [compact, setCompact]=useState(false);

  useEffect(()=>{ saveState(state); },[state]);

  /* Scroll: Navigation wird beim Runterscrollen kompakt, Headlines bewegen sich leicht */
  useEffect(()=>{
    let raf=0, lastY=window.scrollY;
    const frame=()=>{
      raf=0;
      const y=window.scrollY, dy=y-lastY;
      if(y<40) setCompact(false);
      else if(Math.abs(dy)>8){ setCompact(dy>0 && y>90); lastY=y; }
      if(!reducedMotion()) applyParallax(y);
    };
    const onScroll=()=>{ if(!raf) raf=requestAnimationFrame(frame); };
    window.addEventListener("scroll", onScroll, {passive:true});
    return ()=>{ window.removeEventListener("scroll", onScroll); cancelAnimationFrame(raf); };
  },[]);

  useEffect(()=>{
    const tick=()=>setNow(new Date());
    const id=setInterval(tick, 30000);
    const vis=()=>{ if(document.visibilityState==="visible") tick(); };
    document.addEventListener("visibilitychange", vis);
    return ()=>{ clearInterval(id); document.removeEventListener("visibilitychange", vis); };
  },[]);

  /* 00:00 – neuer Tag, alter Tag landet im Verlauf */
  useEffect(()=>{
    const t=todayISO(now);
    if(t!==stateRef.current.todayISO) apply({type:"ROLLOVER", today:t, quest:questFrom(pickQuest(stateRef.current.futureQuest.title), t)});
  },[now]);

  useEffect(()=>{
    const update=()=>setTheme(resolvedTheme());
    let mq=null;
    try{ mq=window.matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener("change", update); }catch(e){}
    const mo=new MutationObserver(update);
    mo.observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
    return ()=>{ try{ mq && mq.removeEventListener("change", update); }catch(e){} mo.disconnect(); };
  },[]);
  useEffect(()=>{
    let m=document.querySelector('meta[name="theme-color"]');
    if(!m){ m=document.createElement("meta"); m.name="theme-color"; document.head.appendChild(m); }
    m.content = theme==="dark" ? "#000000" : "#F2F0EB";
  },[theme]);

  const running=!!(state.focus && state.focus.running);
  useEffect(()=>{
    if(!running) return;
    const id=setInterval(()=>dispatch({type:"TICK_FOCUS"}), 1000);
    return ()=>clearInterval(id);
  },[running]);

  /* Provider */
  const cal=useCalendar(todayISO(now), 15, state.connections.google.enabled);
  const events=mergedEvents(state, cal);
  const weather=useWeather(state.connections.weather.enabled);
  const nativeHealth=!!HealthProvider.native();
  const nativeScreen=!!ScreenTimeProvider.native();
  useEffect(()=>{
    if(!nativeHealth) return;
    let alive=true;
    const load=()=>HealthProvider.stepsToday().then(s=>{ if(alive && s!=null) apply({type:"SET_STEPS", steps:s, source:"apple-health"}); }).catch(()=>{});
    load();
    const id=setInterval(load, 5*60000);
    return ()=>{ alive=false; clearInterval(id); };
  },[nativeHealth]);
  useEffect(()=>{
    if(!nativeScreen) return;
    ScreenTimeProvider.today().then(u=>{ if(u) apply({type:"SET_DIGITAL", data:{...u, source:"native"}}); }).catch(()=>{});
  },[nativeScreen, todayISO(now)]);
  const shortcutSteps = !nativeHealth && state.connections.stepsShortcut.enabled ? stepsFromEvents(events, now) : null;
  const steps = shortcutSteps!=null && shortcutSteps>=state.body.steps
    ? {value:shortcutSteps, source:"shortcut"}
    : {value:state.body.steps, source:state.body.stepsSource || "manual"};
  const plan=dayPlan(state, now, events, now);

  const envRef=useRef(null);
  envRef.current={state, now, events, plan, cal, weather, steps};

  function showToast(t){
    clearTimeout(toastTimer.current);
    setToast({...t, id:Date.now()});
    toastTimer.current=setTimeout(()=>setToast(null), t.kind==="level" ? 2800 : t.kind==="alert" ? 5000 : 2000);
  }
  useEffect(()=>()=>clearTimeout(toastTimer.current),[]);

  useEffect(()=>{
    const prev=prevProfile.current, cur=state.profile;
    prevProfile.current=cur;
    const delta=cur.totalXP-prev.totalXP;
    if(delta<=0) return;
    if(cur.level>prev.level){ Haptics.impact("HEAVY"); showToast({kind:"level", text:pad2(cur.level)}); }
    else showToast({kind:"xp", text:`+${delta} XP`, sub:`Lvl ${cur.level} · ${cur.xp}/${cur.xpToNextLevel}`});
  },[state.profile]);

  /* Proaktive Hinweise: Ausfälle, Gym, Termine – nur Wichtiges, jedes nur einmal */
  useEffect(()=>{
    const alerts=[];
    const lastLesson=plan.lessons.length ? plan.lessons[plan.lessons.length-1] : null;
    plan.changes.forEach(l=>{
      const key=`chg-${plan.iso}-${l.from}-${l.change}-${l.room || ""}`;
      if(notifSeen(key)) return;
      let text;
      if(l.cancelled) text = l===lastLesson && plan.freeDelta>0 ? `Deine letzte Stunde fällt aus. +${fmtDur(plan.freeDelta)} frei.` : `${l.subject} fällt heute aus.`;
      else text=`Raumänderung: ${l.subject} in ${l.room}.`;
      alerts.push({key, text, area:"school"});
    });
    const gb=plan.gymBlock;
    if(gb && !gb.done){
      const until=minsBetween(now, gb.start);
      if(until>0 && until<=45){
        const key=`gym-${plan.iso}`;
        if(!notifSeen(key)){
          const pre=plan.items.find(i=>i.kind==="block" && i.end<=gb.start && i.start>=now);
          alerts.push({key, text:`${endDot(`${cap(gb.gymType)} in ${fmtDur(until)}`)}${pre ? ` ${blockName(pre)} passt vorher rein.` : ""}`, area:"body"});
        }
      }
    }
    plan.items.filter(i=>i.kind==="event").forEach(i=>{
      const until=minsBetween(now, i.start);
      const key=`ev-${i.event.id}-${plan.iso}`;
      if(until>0 && until<=30 && !notifSeen(key)) alerts.push({key, text:`In ${fmtDur(until)} ${i.title}`, area:"focus"});
    });
    if(alerts.length && screen.name!=="focus"){
      const a=alerts[0];
      markNotif(a.key);
      haptic([10,30,10]);
      showToast({kind:"alert", text:a.text, area:a.area});
    }
    /* native App: Erinnerungen vorplanen */
    if(NotificationProvider.native()){
      const key=`native-${plan.iso}-${gb ? hhmm(gb.start) : ""}`;
      if(!notifSeen(key)){
        const list=[];
        if(gb && !gb.done && gb.start-now>45*60000) list.push({key:`n-gym-${plan.iso}`, at:new Date(gb.start.getTime()-45*60000), text:`${cap(gb.gymType)} in 45 Minuten.`});
        plan.items.filter(i=>i.kind==="event" && i.start-now>30*60000).forEach(i=>list.push({key:`n-ev-${i.event.id}`, at:new Date(i.start.getTime()-30*60000), text:`In 30 Minuten: ${i.title}`}));
        NotificationProvider.schedule(list).then(ok=>{ if(ok) markNotif(key); });
      }
    }
  },[plan.iso, now, plan.changes.length, plan.freeDelta, plan.gymBlock && plan.gymBlock.start.getTime(), events.length]);

  /* Termine: NICO OS + Google */
  async function createEvent({title, start, end, allDay, location}){
    const id=makeId("ev");
    apply({type:"ADD_EVENT", event:{id, title, start:start.toISOString(), end:end.toISOString(), allDay:!!allDay, location:location || "", createdAt:Date.now()}});
    let synced=false;
    if(stateRef.current.connections.google.enabled && cal.status==="ok"){
      try{
        const r=await CalendarWriter.create({title, start, end, allDay, location});
        if(r.googleId) apply({type:"UPDATE_EVENT", id, patch:{googleId:r.googleId}});
        synced=true;
      }catch(e){ synced=false; }
    }
    return {id, synced};
  }
  async function updateEvent(ev, patch){
    const clean={}; Object.keys(patch).forEach(k=>{ if(patch[k]!==undefined) clean[k]=patch[k]; });
    const local=(stateRef.current.events || []).find(e=>e.id===ev.id || (ev.googleId && e.googleId===ev.googleId));
    if(local) apply({type:"UPDATE_EVENT", id:local.id, patch:{...(clean.title ? {title:clean.title} : {}), ...(clean.location ? {location:clean.location} : {}),
      ...(clean.start ? {start:clean.start.toISOString()} : {}), ...(clean.end ? {end:clean.end.toISOString()} : {})}});
    const gid=ev.googleId || (local && local.googleId);
    if(gid) await CalendarWriter.update(gid, clean);
    else if(!local) throw new Error("Termin kann nicht geändert werden.");
  }
  async function removeEvent(ev){
    const gid=ev.googleId;
    if(gid) await CalendarWriter.remove(gid);
    (stateRef.current.events || []).filter(e=>e.id===ev.id || (gid && e.googleId===gid)).forEach(e=>apply({type:"DELETE_EVENT", id:e.id}));
  }

  const nico=useNicoAI({stateRef, apply, envRef, createEvent, updateEvent, removeEvent});

  function navigate(name, id, kind, before, y){
    const animated=canTransition();
    withTransition(kind, ()=>{
      flushSync(()=>{ if(before) before(); setVtNav(animated); setCompact(false); setScreen({name, id: id||null}); });
      const top = name==="ai" ? 0 : (y || 0);
      window.scrollTo(0, top);
      if(!reducedMotion()) applyParallax(top);
    });
  }
  function go(name, id, before){
    if(name===screen.name && (id||null)===screen.id && !before) return;
    const kind=navKind(screen.name, name);
    const here={...screen, y:window.scrollY};
    if(name==="ai"){ history.current.push(here); }
    else if((DEPTH[name] ?? 0)===0 || name==="focus" || screen.name==="focus") history.current=[];
    else if(kind==="forward" || kind==="morph") history.current.push(here);
    navigate(name, id, kind, before);
  }
  function back(){
    const prev=history.current.pop() || {name: tabOf(screen.name), id:null, y:0};
    let kind=navKind(screen.name, prev.name);
    if(kind==="tab" || kind==="forward") kind="back";
    navigate(prev.name, prev.id, kind, null, prev.y);
  }
  function startFocus(targetId, source, durationMin){
    haptic(12);
    go("focus", null, ()=>apply({type:"START_FOCUS", targetId, source, durationMin}));
  }
  function changeTheme(pref, e){
    let origin={x: window.innerWidth/2, y: window.innerHeight/2};
    if(e && e.currentTarget){ const r=e.currentTarget.getBoundingClientRect(); origin={x:r.left+r.width/2, y:r.top+r.height/2}; }
    saveThemePref(pref);
    haptic();
    withTransition("theme", ()=>{
      applyTheme(pref);
      flushSync(()=>{ setThemePref(pref); setTheme(resolvedTheme()); });
    }, origin);
  }
  function toggleTheme(e){ changeTheme(theme==="dark" ? "light" : "dark", e); }

  const conns=[
    {id:"school", name:"Stundenplan", state:"on", status:"Aktiv · lokal",
      detail:`EF 2026/27 aus deinem Foto, A-/B-Woche nach Kalenderwoche. ${(state.schoolChanges || []).length} eingetragene Änderungen.`, perms:"nur in NICO OS gespeichert"},
    {id:"iserv", name:"IServ", state:"off", status:"Nicht verbunden", detail:IServProvider.reason,
      setup:"Frag an deiner Schule, ob es einen offiziellen Export für Vertretungsplan oder Kalender gibt. Einen IServ-Kalender kannst du – falls deine Schule einen Abo-Link anbietet – in Google Kalender abonnieren; dann erscheint er hier automatisch."},
    {id:"google", name:"Google Kalender", toggle:"google", enabled:state.connections.google.enabled,
      state: !state.connections.google.enabled ? "off" : cal.status==="ok" ? (cal.stale ? "warn" : "on") : cal.status==="loading" ? "wait" : "warn",
      status: !state.connections.google.enabled ? "Aus" : cal.status==="ok" ? (cal.stale ? "Letzter Stand" : "Verbunden") : cal.status==="loading" ? "Verbinde …" : cal.status==="unavailable" ? "Nur in Claude" : "Problem",
      detail: calMessage(cal) || "Termine lesen, anlegen, verschieben. Löschen nur, wenn du es ausdrücklich willst. Doppelte Termine werden zusammengeführt.",
      perms:"Termine lesen, erstellen, ändern, löschen", sync: cal.syncedAt ? `${hhmm(new Date(cal.syncedAt))} Uhr` : null,
      setup:"Trennen oder neu verbinden in Claude unter Einstellungen → Connectors."},
    {id:"ai", name:"NICO AI", state: nico.ai ? "on" : nico.checked ? "warn" : "wait", status: nico.ai ? "Aktiv" : nico.checked ? "Nur in Claude" : "Prüfe …",
      detail: nico.ai ? `Text${nico.ai.images ? ", Fotos" : ""}${nico.ai.tools ? " und Aktionen in NICO OS" : ""}. Läuft über dein Claude-Konto.` : "Freie Fragen, Fotos und Aktionen gehen nur, wenn NICO OS in Claude läuft. Schnellaktionen funktionieren immer.",
      perms:"liest nur den Ausschnitt deiner Daten, der für die Frage nötig ist"},
    {id:"weather", name:"Wetter", toggle:"weather", enabled:state.connections.weather.enabled,
      state: !state.connections.weather.enabled ? "off" : weather.status==="ok" ? "on" : weather.status==="stale" ? "warn" : weather.status==="blocked" ? "warn" : "wait",
      status: !state.connections.weather.enabled ? "Aus" : weather.status==="ok" ? `Aktiv · ${WEATHER_LOC.name}` : weather.status==="stale" ? "Letzter Stand" : weather.status==="blocked" ? "Hier blockiert" : "Lade …",
      detail: weather.status==="blocked" ? "In Claude dürfen Seiten keine Wetterdaten abrufen. In der Web-App-Version (Vercel/Home-Bildschirm) funktioniert es." : "Open-Meteo, ohne Konto. Wird kontextuell genutzt.",
      sync: weather.data ? `${hhmm(new Date(weather.data.at))} Uhr` : null},
    {id:"health", name:"Apple Health · Schritte", toggle: nativeHealth ? null : "stepsShortcut", enabled:state.connections.stepsShortcut.enabled,
      state: nativeHealth ? "on" : shortcutSteps!=null ? "on" : "off",
      status: nativeHealth ? "Verbunden" : shortcutSteps!=null ? "Über Kurzbefehl" : "Native App nötig",
      detail: nativeHealth ? "Schritte kommen automatisch aus HealthKit." : "Eine Web-App kann Apple Health nicht lesen. Die iPhone-App (Capacitor + Swift) ist vorbereitet. Bis dahin: Ein iPhone-Kurzbefehl kann „8432 Schritte“ als Termin in Google Kalender eintragen – NICO OS übernimmt die Zahl automatisch.",
      perms:"nur Schritte lesen"},
    {id:"screen", name:"Bildschirmzeit", state: nativeScreen ? "on" : "off", status: nativeScreen ? "Verbunden" : "Native App nötig",
      detail:"Screen Time ist nur in einer echten iPhone-App lesbar (DeviceActivity / FamilyControls). Die Schnittstelle ist vorbereitet; bis dahin sind die Werte Beispiele."},
    {id:"push", name:"Benachrichtigungen", state: NotificationProvider.native() ? "on" : "warn", status: NotificationProvider.native() ? "Push aktiv" : "In der App",
      detail:"Ausfälle, Raumänderungen, Gym in 45 Min. und Termine in 30 Min. erscheinen oben in der Island, solange NICO OS offen ist. Echte Push-Nachrichten kommen mit der iPhone-App."},
    {id:"gmail", name:"Gmail", state:"off", status:"Nicht verbunden", detail:"Geplant: nur wichtige Signale (z. B. Antwort von BIANCO, Schulmails), kein E-Mail-Postfach.", setup:"In Claude unter Einstellungen → Connectors Gmail verbinden, dann baue ich die Signale ein."},
    {id:"drive", name:"Google Drive", state:"off", status:"Nicht verbunden", detail:"Geplant: passende Dateien direkt bei Projekten (z. B. Lebenslauf bei BIANCO).", setup:"In Claude unter Einstellungen → Connectors Google Drive verbinden."},
  ];
  const connSummary=`${conns.filter(c=>c.state==="on").length} aktiv · ${conns.filter(c=>c.state!=="on").length} offen`;

  const info=focusInfo(state);
  const live = info && screen.name!=="focus" ? info : null;
  const openAdd=(opts)=>setAddSheet(opts || {});

  let content;
  switch(screen.name){
    case "plan": content=<PlanScreen state={state} dispatch={apply} now={now} openAdd={openAdd} removeEvent={removeEvent}/>; break;
    case "skills": content=<SkillsScreen state={state} go={go}/>; break;
    case "skill-detail": content=<SkillDetail state={state} dispatch={apply} back={back} id={screen.id} startFocus={startFocus}/>; break;
    case "projekte": content=<ProjekteScreen state={state} go={go} back={back}/>; break;
    case "settings": content=<SettingsScreen state={state} back={back} themePref={themePref} changeTheme={changeTheme}/>; break;
    case "project-detail": content=<ProjectDetail state={state} back={back} id={screen.id}/>; break;
    case "level": content=<LevelScreen state={state} back={back}/>; break;
    case "ich": content=<IchScreen state={state} go={go} connSummary={connSummary}/>; break;
    case "profile": content=<ProfileScreen state={state} dispatch={apply} back={back}/>; break;
    case "connections": content=<ConnectionsScreen state={state} dispatch={apply} back={back} conns={conns}/>; break;
    case "history": content=<HistoryScreen state={state} back={back}/>; break;
    case "body": content=<BodyScreen state={state} dispatch={apply} go={go} back={back} steps={steps} plan={plan}/>; break;
    case "fuel": content=<FuelScreen state={state} dispatch={apply} go={go} back={back}/>; break;
    case "snap": content=<SnapMeal state={state} dispatch={apply} go={go} back={back}/>; break;
    case "digital": content=<DigitalScreen state={state} back={back}/>; break;
    case "focus": content=<FocusMode state={state} dispatch={apply} go={go} minimize={()=>go("heute")}/>; break;
    case "ai": content=<AIScreen state={state} back={back} nico={nico}/>; break;
    default: content=<HeuteScreen state={state} dispatch={apply} go={go} theme={theme} toggleTheme={toggleTheme} startFocus={startFocus}
      plan={plan} now={now} events={events} cal={cal} weather={weather} steps={steps} openAdd={openAdd}/>;
  }

  return (
    <>
      <Island toast={toast} live={live} onTap={()=>go("focus")}/>
      <main className={vtNav ? "vt-nav" : ""}>{content}</main>
      {screen.name!=="focus" && screen.name!=="ai" && <BottomNav screen={screen} go={go} compact={compact} onAI={()=>{ Haptics.light(); go("ai"); }}/>}
      {addSheet && (
        <QuickAdd initial={addSheet} onClose={()=>setAddSheet(null)}
          onAdd={async ({kind, title, area, date, time, minutes})=>{
            haptic();
            if(kind==="task"){
              apply({type:"ADD_TASK", id:makeId("q"), title, area, date: date!==stateRef.current.todayISO ? date : undefined, time: time || undefined,
                subtitle: /no\s*disc/i.test(title) ? "No Disc" : undefined});
              setAddSheet(null);
              showToast({kind:"info", text:"Aufgabe hinzugefügt", area});
            } else {
              const day=dateFromISO(date), start=atTime(day, time), end=new Date(start.getTime()+minutes*60000);
              const r=await createEvent({title, start, end});
              setAddSheet(null);
              showToast({kind:"info", text: r.synced ? "Termin eingetragen · Google" : "Termin eingetragen", area:"focus"});
            }
          }}/>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
