}

/* ================= reducer ================= */
const WEEKDAY_CODE=["SO","MO","DI","MI","DO","FR","SA"];
function xpForLevel(level){ return 400 + level*120; }
function grantXP(state, amount){
  let {level, xp, xpToNextLevel} = state.profile;
  xp += amount;
  while(xp >= xpToNextLevel){ xp -= xpToNextLevel; level += 1; xpToNextLevel = xpForLevel(level); }
  const today=state.todayISO || todayISO();
  const dayXp=(state.xpDay && state.xpDay.date===today ? state.xpDay.xp : 0) + amount;
  return {...state, xpDay:{date:today, xp:dayXp},
    profile:{...state.profile, level, xp, xpToNextLevel, totalXP: state.profile.totalXP + amount}};
}
function markGymToday(state, done){
  const code=WEEKDAY_CODE[dateFromISO(state.todayISO).getDay()];
  const today=state.body.gym.find(g=>g.day===code && g.type!=="RUHE");
  const target = today || state.body.gym.find(g=>!g.done && g.type!=="RUHE");
  if(!target) return state;
  return {...state, body:{...state.body, gym: state.body.gym.map(g=>g.day===target.day ? {...g, done} : g)}};
}
function archiveDay(state){
  const d=state.todayISO;
  const t=fuelTotals(state.fuel);
  const g=state.body.gym.find(x=>x.day===WEEKDAY_CODE[dateFromISO(d).getDay()]);
  const entry={date:d, steps:state.body.steps, stepsSource:state.body.stepsSource || "manual",
    kcal:t.kcal, protein:t.protein, carbs:t.carbs, fat:t.fat, meals:state.fuel.meals,
    tasksDone:state.queue.filter(q=>q.done).map(q=>({title:q.title, area:areaOf(q)})),
    tasksOpen:state.queue.filter(q=>!q.done && (!q.date || q.date<=d)).length,
    xp: state.xpDay && state.xpDay.date===d ? state.xpDay.xp : 0,
    ...(state.xpLegacy && state.xpLegacy.date===d ? {xpLegacy:state.xpLegacy.xp} : {}),
    quest:{title:state.futureQuest.title, category:state.futureQuest.category, done:state.futureQuest.done,
      ...(state.questDoneBeforeReset && state.questDoneBeforeReset===state.futureQuest.id ? {legacy:true} : {})},
    gym: g && g.type!=="RUHE" ? {type:g.type, done:g.done} : null,
    focusSessions:(state.focusLog || []).filter(f=>f.date===d).length,
    digital: state.digital && state.digital.source!=="demo" ? {screenTimeMin:state.digital.screenTimeMin, consumeMin:state.digital.consumeMin, createMin:state.digital.createMin} : null};
  const prev=(state.history || {})[d];
  return {...(state.history || {}), [d]: prev ? {...prev, ...entry} : entry};
}
function findTask(state, match){
  if(!match) return null;
  const q=String(match).toLowerCase();
  return state.queue.find(t=>t.id===match) ||
    state.queue.find(t=>!t.done && t.title.toLowerCase()===q) ||
    state.queue.find(t=>!t.done && (t.title.toLowerCase().includes(q) || q.includes(t.title.toLowerCase()) ||
      (t.subtitle || "").toLowerCase().includes(q)));
}

function reducer(state, action){
  switch(action.type){
    case "COMPLETE_QUEUE_ITEM": {
      const target=state.queue.find(q=>q.id===action.id);
      if(!target || target.done) return state;
      let next={...state, queue: state.queue.map(q=>q.id===action.id ? {...q, done:true, doneAt:Date.now()} : q)};
      next=grantXP(next, target.xp);
      if(target.kind==="gym") next=markGymToday(next, true);
      return next;
    }
    case "REOPEN_TASK":
      return {...state, queue: state.queue.map(q=>q.id===action.id ? {...q, done:false} : q)};
    case "COMPLETE_QUEST": {
      if(state.futureQuest.done) return state;
      const next={...state, futureQuest:{...state.futureQuest, done:true},
        profile:{...state.profile, zukunftAktuell: Math.min(state.profile.zukunftAktuell+1, state.profile.zukunftZiel)}};
      return grantXP(next, state.futureQuest.xp);
    }
    case "REROLL_QUEST": {
      if(state.futureQuest.rerolled || state.futureQuest.done) return state;
      const t=action.quest || pickQuest(state.futureQuest.title);
      return {...state, futureQuest:{...state.futureQuest, category:t.category, title:t.title, minutes:t.minutes, xp:t.xp, fp:t.fp, rerolled:true}};
    }
    case "START_FOCUS":
      return {...state, focus:{targetId:action.targetId, source:action.source,
        durationSec:action.durationMin*60, remainingSec:action.durationMin*60, running:true, startedAt:Date.now()}};
    case "TICK_FOCUS":
      if(!state.focus || !state.focus.running) return state;
      if(state.focus.remainingSec<=1) return {...state, focus:{...state.focus, remainingSec:0, running:false}};
      return {...state, focus:{...state.focus, remainingSec: state.focus.remainingSec-1}};
    case "PAUSE_FOCUS": return state.focus ? {...state, focus:{...state.focus, running:false}} : state;
    case "RESUME_FOCUS": return state.focus && state.focus.remainingSec>0 ? {...state, focus:{...state.focus, running:true}} : state;
    case "CANCEL_FOCUS": return {...state, focus:null};
    case "FINISH_FOCUS": {
      if(!state.focus) return state;
      const {targetId, source, durationSec, remainingSec}=state.focus;
      const minutes=Math.max(1, Math.round((durationSec-remainingSec)/60));
      const cleared={...state, focus:null, focusLog:[...(state.focusLog || []), {date:state.todayISO, source, targetId, minutes, at:Date.now()}].slice(-400)};
      if(source==="quest") return reducer(cleared, {type:"COMPLETE_QUEST"});
      if(source==="skill") return reducer(cleared, {type:"LOG_SKILL_SESSION", skillId:targetId, minutes});
      return reducer(cleared, {type:"COMPLETE_QUEUE_ITEM", id:targetId});
    }
    case "ADD_STEPS":
      return {...state, body:{...state.body, steps: state.body.steps + action.amount, stepsSource:"manual"}};
    case "SET_STEPS":
      if(state.body.steps===action.steps && state.body.stepsSource===action.source) return state;
      return {...state, body:{...state.body, steps: action.steps, stepsSource: action.source}};
    case "TOGGLE_GYM_DAY": {
      const day=state.body.gym.find(g=>g.day===action.day);
      if(!day || day.type==="RUHE") return state;
      const next={...state, body:{...state.body, gym: state.body.gym.map(g=>g.day===action.day ? {...g, done:!g.done} : g)}};
      return day.done ? next : grantXP(next, 25);
    }
    case "SET_GYM_PLAN": {
      const gymPlan={...(state.gymPlan || {})};
      if(action.value==null) delete gymPlan[action.date]; else gymPlan[action.date]=action.value;
      return {...state, gymPlan};
    }
    case "LOG_MEAL":
      return grantXP({...state, fuel:{...state.fuel, meals:[...state.fuel.meals, {...action.meal, date:state.todayISO, at:Date.now()}]}}, 10);
    case "DELETE_MEAL":
      return {...state, fuel:{...state.fuel, meals: state.fuel.meals.filter(m=>m.id!==action.id)}};
    case "SET_KCAL_GOAL":
      return {...state, fuel:{...state.fuel, kcalGoal: clamp(action.value, 1200, 5000)}};
    case "SET_PROTEIN_GOAL":
      return {...state, fuel:{...state.fuel, proteinGoal: clamp(action.value, 40, 300)}};
    case "COMPLETE_NODE": {
      const skill=state.skills.find(s=>s.id===action.skillId);
      if(!skill) return state;
      const idx=skill.nodes.findIndex(n=>n.id===action.nodeId);
      if(idx===-1 || skill.nodes[idx].status!=="current") return state;
      const nodes=skill.nodes.map((n,i)=> i===idx ? {...n, status:"completed", doneAt:state.todayISO} : i===idx+1 ? {...n, status:"current"} : n);
      let xp=skill.xp+50, level=skill.level, xpToNext=skill.xpToNext;
      while(xp>=xpToNext){ xp-=xpToNext; level+=1; xpToNext=Math.round(xpToNext*1.15); }
      const next={...state, skills: state.skills.map(s=>s.id===action.skillId ? {...s, nodes, xp, level, xpToNext} : s)};
      return grantXP(next, 40);
    }
    case "LOG_SKILL_SESSION": {
      const skill=state.skills.find(s=>s.id===action.skillId);
      if(!skill) return state;
      let xp=skill.xp+SKILL_SESSION_XP, level=skill.level, xpToNext=skill.xpToNext || SKILL_XP_START;
      while(xp>=xpToNext){ xp-=xpToNext; level+=1; xpToNext=Math.round(xpToNext*1.15); }
      const sessions=[...(skill.sessions || []), {date:state.todayISO, minutes:action.minutes || 15, kind:action.kind || "session", title:action.title || null}].slice(-200);
      const next={...state, skills: state.skills.map(s=>s.id===action.skillId ? {...s, xp, level, xpToNext, sessions} : s)};
      return grantXP(next, SKILL_SESSION_XP);
    }
    case "ADD_TASK": {
      const title=String(action.title || "").trim();
      if(!title) return state;
      const task={id:action.id || makeId("q"), kind:"task", area:action.area || "focus", title, once:true,
        durationMin:action.minutes || 15, xp:15, done:false, createdAt:Date.now()};
      if(action.subtitle) task.subtitle=action.subtitle;
      if(action.date) task.date=action.date;
      if(action.due) task.due=action.due;
      if(action.time) task.time=action.time;
      return {...state, queue:[...state.queue, task]};
    }
    case "UPDATE_TASK":
      return {...state, queue: state.queue.map(q=>q.id===action.id ? {...q, ...action.patch} : q)};
    case "DELETE_TASK":
      return {...state, queue: state.queue.filter(q=>q.id!==action.id)};
    case "ADD_EVENT":
      return {...state, events:[...(state.events || []), action.event]};
    case "UPDATE_EVENT":
      return {...state, events:(state.events || []).map(e=>e.id===action.id ? {...e, ...action.patch} : e)};
    case "DELETE_EVENT":
      return {...state, events:(state.events || []).filter(e=>e.id!==action.id)};
    case "SET_SCHOOL_CHANGE": {
      const rest=(state.schoolChanges || []).filter(c=>!(c.date===action.date && c.from===action.from));
      if(action.change==="restore") return {...state, schoolChanges:rest};
      return {...state, schoolChanges:[...rest, {date:action.date, from:action.from, type:action.change, room:action.room || "", note:action.note || "", source:action.source || "manuell", at:Date.now()}]};
    }
    case "SET_ROUTINE":
      return {...state, profile:{...state.profile, routine:{...routine(state), ...action.patch}}};
    case "SET_BODY_PROFILE":
      return {...state, profile:{...state.profile, body:{...(state.profile.body || {}), ...action.patch}}};
    case "SET_CONNECTION":
      return {...state, connections:{...state.connections, [action.key]:{...(state.connections[action.key] || {}), ...action.patch}}};
    case "SET_DIGITAL":
      return {...state, digital:{...state.digital, ...action.data}};
    case "AI_ADD":
      return {...state, ai:{...state.ai, messages:[...state.ai.messages, action.message].slice(-150)}};
    case "AI_UPDATE":
      return {...state, ai:{...state.ai, messages: state.ai.messages.map(m=>m.id===action.id ? {...m, ...action.patch} : m)}};
    case "AI_CLEAR":
      return {...state, ai:{...state.ai, messages:[]}};
    case "REMEMBER": {
      const fact=String(action.fact || "").trim().slice(0,200);
      if(!fact || state.ai.memory.some(m=>m.fact.toLowerCase()===fact.toLowerCase())) return state;
      return {...state, ai:{...state.ai, memory:[...state.ai.memory, {id:action.id || makeId("mem"), fact, at:Date.now()}].slice(-60)}};
    }
    case "FORGET":
      return {...state, ai:{...state.ai, memory: state.ai.memory.filter(m=>m.id!==action.id)}};
    case "ROLLOVER": {
      if(state.todayISO===action.today) return state;
      const history=archiveDay(state);
      const prevDay=dateFromISO(state.todayISO), newDay=dateFromISO(action.today);
      const newWeek=mondayOf(prevDay).getTime()!==mondayOf(newDay).getTime();
      const queue=state.queue.filter(q=>!(q.once && q.done)).map(q=>q.once ? q : {...q, done:false});
      const gymPlan={};
      Object.keys(state.gymPlan || {}).forEach(k=>{ if(k>=action.today) gymPlan[k]=state.gymPlan[k]; });
      const cutoff=todayISO(addDays(newDay, -120));
      return {...state, todayISO:action.today, history, queue, gymPlan,
        futureQuest:action.quest, focus:null, xpDay:{date:action.today, xp:0},
        fuel:{...state.fuel, meals:[]},
        body:{...state.body, steps:0, stepsSource:"manual", gym: newWeek ? state.body.gym.map(g=>({...g, done:false})) : state.body.gym},
        schoolChanges:(state.schoolChanges || []).filter(c=>c.date>=cutoff),
        digital: state.digital.source==="demo" ? state.digital : {...state.digital, screenTimeMin:0, consumeMin:0, createMin:0, createMinYesterday:state.digital.createMin, apps:[]}};
    }
    default: return state;
  }
}

function init(){
  let raw=null, stored=null;
  try{ raw=localStorage.getItem(STORAGE_KEY); }catch(e){}
  if(raw){
    try{ stored=JSON.parse(raw); }
    catch(e){ try{ localStorage.setItem(STORAGE_KEY+"-unreadable-"+Date.now(), raw); }catch(err){} }
  }
  if(stored && (stored.schema || 1) < SCHEMA){
    try{ if(!localStorage.getItem(BACKUP_KEY)) localStorage.setItem(BACKUP_KEY, raw); }catch(e){}
  }
  let base = migrate(stored || seedState());
  const today=todayISO();
  if(base.todayISO!==today) base=reducer(base, {type:"ROLLOVER", today, quest:questFrom(pickQuest(base.futureQuest && base.futureQuest.title), today)});
  return base;
}

/* ================= selectors ================= */
function fuelTotals(fuel){ return fuel.meals.reduce((a,m)=>({kcal:a.kcal+m.kcal, protein:a.protein+m.protein, carbs:a.carbs+m.carbs, fat:a.fat+m.fat}), {kcal:0,protein:0,carbs:0,fat:0}); }
function mealKcal(fuel, name){ const e=fuel.meals.filter(m=>m.meal===name); return e.length ? e.reduce((a,m)=>a+m.kcal,0) : null; }
function gymCount(state){ const w=state.body.gym.filter(g=>g.type!=="RUHE"); return {done:w.filter(g=>g.done).length, total:w.length}; }
function isNoDisc(q){ return /no\s*disc/i.test(`${q.title} ${q.subtitle || ""}`); }
function cap(s){ s=String(s || "").toLowerCase(); return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtDur(min){
  min=Math.max(0, Math.round(min));
  const h=Math.floor(min/60), m=min%60;
  if(h && m) return `${h} Std. ${m} Min.`;
  if(h) return `${h} Std.`;
  return `${m} Min.`;
}
function minsBetween(a,b){ return Math.round((b-a)/60000); }
function endDot(t){ t=String(t); return /[.!?]$/.test(t) ? t : `${t}.`; }
function blockName(b){ return b.quest ? "Skill-Session" : (b.label || b.title); }
function taskOnDay(q, iso, isToday){
  if(q.date) return q.date===iso || (isToday && q.date<iso && !q.done);
  return isToday;
}
function openTasksToday(state){
  const iso=state.todayISO;
  return state.queue.filter(q=>!q.done && q.kind!=="gym" && taskOnDay(q, iso, true));
}
function dayStreak(state){
  let n=0;
  for(let i=0;i<400;i++){
    const d=todayISO(addDays(dateFromISO(state.todayISO), -i));
    if(!sinceReset(state, d)) break;
    const xp = i===0 ? (state.xpDay && state.xpDay.xp) || 0 : ((state.history || {})[d] || {}).xp || 0;
    if(xp>0) n++; else if(i>0) break;
  }
  return n;
}
function questsDone(state){
  const h=state.history || {};
  const today = state.futureQuest.done && state.futureQuest.id!==state.questDoneBeforeReset ? 1 : 0;
  return Object.keys(h).filter(d=>sinceReset(state, d) && d!==state.todayISO && h[d].quest && h[d].quest.done && !h[d].quest.legacy).length + today;
}
function momentumDays(state){
  let n=0;
  for(let i=0;i<7;i++){
    const d=todayISO(addDays(dateFromISO(state.todayISO), -i));
    if(!sinceReset(state, d)) continue;
    const xp = i===0 ? (state.xpDay && state.xpDay.xp) || 0 : ((state.history || {})[d] || {}).xp || 0;
    if(xp>0) n++;
  }
  return n;
}
function focusInfo(state){
  const f=state.focus; if(!f) return null;
  let title="", area="focus", xp=0, label="Fokus";
  if(f.source==="quest"){ title=state.futureQuest.title; area="future"; xp=state.futureQuest.xp; label=`Zukunft · ${state.futureQuest.category}`; }
  else if(f.source==="skill"){
    const i=state.skills.findIndex(s=>s.id===f.targetId); const s=state.skills[i];
    if(s){ const cur=s.nodes.find(n=>n.status==="current"); title=cur ? `${s.name} · ${cur.title}` : s.name; area=skillArea(s,i); xp=20; label="Skill-Session"; }
  }
  else { const it=state.queue.find(q=>q.id===f.targetId); if(it){ title=it.title; area=areaOf(it); xp=it.xp; label=it.subtitle ? `${AREA_LABEL[area]} · ${it.subtitle}` : AREA_LABEL[area]; } }
  const total=f.durationSec || f.remainingSec || 1;
  return {title, area, xp, label, running:f.running, remaining:f.remainingSec,
    pct: clamp((1 - f.remainingSec/total)*100, 0, 100),
    mm: pad2(Math.floor(f.remainingSec/60)), ss: pad2(f.remainingSec%60), done: f.remainingSec===0};
}

/* ================= Tages-Engine: Schule, Termine, Blöcke, freie Zeit ================= */
function isGymEvent(e){ return /\b(gym|push|pull|legs?|training|workout|fitness)\b/i.test(e.title || ""); }
function freeGaps(from, to, busy, minMin=10){
  const bs=busy.filter(b=>b.end>from && b.start<to).sort((a,b)=>a.start-b.start);
  const gaps=[]; let cur=from;
  for(const b of bs){
    if(b.start>cur){ const end=b.start<to ? b.start : to; if(minsBetween(cur,end)>=minMin) gaps.push({start:cur, end}); }
    if(b.end>cur) cur=b.end;
    if(cur>=to) break;
  }
  if(cur<to && minsBetween(cur,to)>=minMin) gaps.push({start:cur, end:to});
  return gaps;
}
function placeBlock(gaps, minutes, notBefore){
  for(const g of gaps){
    const s=g.start<notBefore ? notBefore : g.start;
    if(minsBetween(s, g.end)>=minutes) return {start:s, end:new Date(s.getTime()+minutes*60000)};
  }
  return null;
}
function dayPlan(state, day, allEvents, now=new Date()){
  const R=routine(state);
  const iso=todayISO(day);
  const isToday=sameDay(day, now);
  const lessons=schoolLessons(state, day);
  const active=lessons.filter(l=>!l.cancelled);
  const orig=lessonsOn(day);
  const schoolStart=active.length ? active[0].start : null;
  const schoolEnd=active.length ? active[active.length-1].end : null;
  const origStart=orig.length ? orig[0].start : null;
  const origEnd=orig.length ? orig[orig.length-1].end : null;
  const evs=allEvents.filter(e=>eventOnDay(e, day) && !isStepsEvent(e));
  const timed=evs.filter(e=>!e.allDay), allDay=evs.filter(e=>e.allDay);
  const dayEnd=atTime(day, R.dayEnd);
  const windowStart=schoolEnd || atTime(day, R.dayStart);
  const busy=[];
  const items=[];
  if(schoolStart) busy.push({start:schoolStart, end:schoolEnd});
  timed.forEach(e=>busy.push({start:e.start, end:e.end}));

  lessons.forEach(l=>items.push({kind:"lesson", key:`l${l.from}`, start:l.start, end:l.end, title:l.subject, area:"school", lesson:l,
    cancelled:!!l.cancelled, change:l.change || null,
    sub:[l.cancelled ? "fällt aus" : null,
      l.change==="room" ? `Raum ${l.room} statt ${l.origRoom || "?"}` : (l.room && !l.cancelled ? `Raum ${l.room}` : null),
      !l.cancelled ? l.teacher : null, l.to>l.from && !l.cancelled ? "Doppelstunde" : null].filter(Boolean).join(" · ")}));
  for(let i=1;i<active.length;i++){
    const gap=minsBetween(active[i-1].end, active[i].start);
    const lunch=active[i-1].end.getHours()>=11 && active[i].start.getHours()<=13 && gap<=60;
    if(gap>=30) items.push({kind:"freistunde", key:`fs${i}`, start:active[i-1].end, end:active[i].start, title: lunch ? "Mittagspause" : "Freistunde", sub:fmtDur(gap), area:"school"});
  }
  timed.forEach(e=>items.push({kind:"event", key:`e${e.id}`, start:e.start, end:e.end, title:e.title,
    sub:[e.location, e.source==="nicoos" ? "NICO OS" : "Google Kalender"].filter(Boolean).join(" · "), area: isGymEvent(e) ? "body" : "focus", event:e}));

  const code=WEEKDAY_CODE[day.getDay()];
  const g=state.body.gym.find(x=>x.day===code);
  const planned=(state.gymPlan || {})[iso];
  const gymEvent=timed.find(isGymEvent) || null;
  let gymBlock=null;
  if(g && g.type!=="RUHE" && planned!=="skip" && !gymEvent){
    const qg=state.queue.find(q=>q.kind==="gym");
    const time=planned || (qg && qg.time) || R.gymTime;
    let start=atTime(day, time), end=new Date(start.getTime()+R.gymMin*60000), moved=false;
    if(busy.some(b=>b.start<end && b.end>start)){
      const gaps=freeGaps(windowStart, dayEnd, busy, R.gymMin);
      const p=placeBlock(gaps, R.gymMin, start) || placeBlock(gaps, R.gymMin, windowStart);
      if(p){ start=p.start; end=p.end; moved=true; }
    }
    const done = isToday ? g.done : false;
    gymBlock={kind:"gym", key:"gym", start, end, title:`Gym · ${cap(g.type)}`, gymType:g.type, area:"body", done, moved, planned:!!planned,
      sub:`${fmtDur(R.gymMin)}${moved ? " · verschoben, weil da etwas anderes ist" : ""}${done ? " · erledigt" : ""}`};
    busy.push({start, end});
    items.push(gymBlock);
  }

  const dayTasks=state.queue.filter(q=>q.kind!=="gym" && taskOnDay(q, iso, isToday));
  dayTasks.filter(q=>q.time && !q.done).forEach(q=>{
    const s=atTime(day, q.time), e=new Date(s.getTime()+(q.durationMin || 15)*60000);
    busy.push({start:s, end:e});
    items.push({kind:"task", key:`t${q.id}`, start:s, end:e, title:q.title, sub:`${fmtDur(q.durationMin || 15)} · Aufgabe`, area:areaOf(q), task:q});
  });

  const notBefore = isToday ? new Date(Math.max(now.getTime(), windowStart.getTime())) : windowStart;
  const flex=[];
  const nd=dayTasks.find(q=>!q.done && !q.time && isNoDisc(q));
  if(nd) flex.push({kind:"block", key:`b${nd.id}`, title:nd.title, label:"No Disc", minutes:R.noDiscMin, area:areaOf(nd), task:nd});
  if(isToday && !state.futureQuest.done) flex.push({kind:"block", key:"quest", title:`Skill · ${state.futureQuest.category}`, label:state.futureQuest.title, minutes:R.skillMin, area:"future", quest:true});
  for(const f of flex){
    let p=null;
    if(gymBlock && gymBlock.start>notBefore) p=placeBlock(freeGaps(notBefore, gymBlock.start, busy, f.minutes), f.minutes, notBefore);
    if(!p) p=placeBlock(freeGaps(notBefore, dayEnd, busy, f.minutes), f.minutes, notBefore);
    if(p){
      items.push({...f, start:p.start, end:p.end, suggested:true, sub:f.label});
      busy.push({start:p.start, end:p.end});
    }
  }

  const freeFrom = isToday ? new Date(Math.max(now.getTime(), windowStart.getTime())) : windowStart;
  const gaps = freeFrom<dayEnd ? freeGaps(freeFrom, dayEnd, busy, 15) : [];
  gaps.forEach(gp=>items.push({kind:"free", key:`f${gp.start.getTime()}`, start:gp.start, end:gp.end,
    title:`${fmtDur(minsBetween(gp.start, gp.end))} frei`, area:"fuel"}));
  const freeRemaining=gaps.reduce((a,gp)=>a+minsBetween(gp.start, gp.end), 0);
  const span=(a,b)=> a && b ? minsBetween(a,b) : 0;
  const freeDelta=span(origStart, origEnd) - span(schoolStart, schoolEnd);
  const order={lesson:0, freistunde:1, event:2, gym:3, task:4, block:5, free:6};
  items.sort((a,b)=>(a.start-b.start) || (order[a.kind]-order[b.kind]));
  return {iso, day, isToday, R, lessons, active, schoolStart, schoolEnd, origEnd, freeDelta,
    changes:lessons.filter(l=>l.change), items, allDay, gaps, freeRemaining, gymBlock, gymEvent, dayEnd, gymDay:g};
}

/* ================= HEUTE: Bausteine ================= */
function TaskRow({item, onComplete}){
  const [phase,setPhase]=useState("idle");
  const [dx,setDx]=useState(0);
  const [dragging,setDragging]=useState(false);
  const start=useRef(null);
  const area=areaOf(item);

  function complete(){
    if(phase!=="idle") return;
    Haptics.light();
    setPhase("checked");
    setTimeout(()=>setPhase("leaving"), 450);
    setTimeout(()=>onComplete(item.id), 800);
  }
  function down(e){ if(phase!=="idle" || e.target.closest("button")) return; start.current={x:e.clientX}; setDragging(true); }
  function move(e){ if(!start.current) return; setDx(clamp(e.clientX-start.current.x, 0, 130)); }
  function up(){
    if(!start.current) return;
    const go=dx>80;
    start.current=null; setDragging(false); setDx(0);
    if(go) complete();
  }
  const pct=clamp(dx/80, 0, 1);
  return (
    <div className={`task ${phase}`} data-area={area}>
      <div className="task-clip">
        <div className="task-body">
          <div className="task-swipe" style={{opacity:pct}} aria-hidden="true">
            <span style={{display:"grid", transform:`scale(${.5+pct*.6})`, transition:dragging?"none":"transform .3s"}}><IconCheck size={20}/></span>
          </div>
          <div className="task-fg"
            onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onPointerLeave={up}
            style={{transform:`translateX(${dx}px)`, transition: dragging ? "none" : undefined}}>
            <button className="check press" onClick={complete} aria-label={`${item.title} abhaken`}><IconCheck size={14}/></button>
            <div className="task-text">
              <span className="task-title">{item.title}</span>
              <span className="task-sub"><i/>{AREA_LABEL[area]}{item.time ? ` · ${item.time}` : ""} · {item.durationMin} min</span>
            </div>
            <span className="task-xp"><CountUp to={item.xp || 0} run={phase!=="idle"}/></span>
          </div>
        </div>
      </div>
    </div>
  );
}

      <button className="arow-main" onClick={onTap} disabled={!onTap}>
        <span className="arow-title">{item.title}{item.change==="room" && <span className="flag">Raum</span>}{item.cancelled && <span className="flag">Ausfall</span>}{pill && <span className="free-pill">{pill}</span>}</span>
        {item.sub && <span className="arow-sub">{item.sub}</span>}
      </button>
      {onStart && <button className="arow-start press" onClick={onStart} aria-label={`${item.title} starten`}><IconPlay/></button>}
    </div>
  );
}

/* ---------- JETZT ---------- */
function NowTile({plan, now, state, go, startItem, completeGym, focusOn}){
  const cur=plan.items.find(i=>i.kind!=="free" && !i.cancelled && now>=i.start && now<i.end);
  const freeNow=plan.items.find(i=>i.kind==="free" && now>=i.start && now<i.end);
  const nextBlock=plan.items.find(i=>(i.kind==="block" || i.kind==="task") && i.start>=now);
  if(focusOn){
    const info=focusInfo(state);
    return (
      <button className="tile now press" data-area={info.area} onClick={()=>go("focus")}>
        <div className="t-label">Jetzt · Fokus läuft</div>
        <h2 className="t-title">{info.title}</h2>
        <div className="t-meta tabular">noch {info.mm}:{info.ss}</div>
      </button>
    );
  }
  if(cur){
    const total=minsBetween(cur.start, cur.end), done=minsBetween(cur.start, now);
    const startable = cur.kind==="block" || cur.kind==="task";

      <div className="tile now" data-area={cur.area}>
        <div className="t-label">Jetzt · {cur.kind==="lesson" ? "Schule" : cur.kind==="freistunde" ? cur.title : cur.kind==="gym" ? "Gym" : cur.kind==="event" ? "Termin" : "Block"}</div>
        <h2 className="t-title">{cur.kind==="freistunde" ? `${cur.title} bis ${hhmm(cur.end)}` : cur.title}</h2>
        <div className="t-meta">bis {hhmm(cur.end)} · noch {fmtDur(minsBetween(now, cur.end))}{cur.kind==="lesson" && cur.lesson.room ? ` · Raum ${cur.lesson.room}` : ""}</div>
        <div className="tbar" aria-hidden="true"><i style={{width:`${clamp(done/total*100,0,100)}%`}}/></div>
        {startable && (
          <div className="btn-row"><button className="cta press" onClick={e=>startItem(cur, e)}>Starten<span className="arr"><IconArrow size={18}/></span></button></div>
        )}
        {cur.kind==="gym" && !cur.done && (
          <div className="btn-row"><button className="cta press" style={vt("gym-state")} onClick={completeGym}>Training erledigt<span className="arr"><IconCheck size={16}/></span></button></div>
        )}
        {cur.kind==="gym" && cur.done && (
          <div className="done-line" style={vt("gym-state")}><span className="ck"><IconCheck size={15}/></span>Training erledigt · +25 XP</div>
        )}
      </div>
    );
  }
  if(freeNow){
    const upcoming=plan.items.find(i=>i.kind!=="free" && !i.cancelled && i.start>=freeNow.end);
    const fits=nextBlock && nextBlock.start<=new Date(freeNow.end.getTime()) ? nextBlock : null;
    return (
      <div className="tile now" data-area="fuel">
        <div className="t-label">Jetzt · frei</div>
        <h2 className="t-title">Noch {fmtDur(minsBetween(now, freeNow.end))} frei</h2>
        <div className="t-meta">{upcoming ? `bis ${hhmm(freeNow.end)} · dann ${upcoming.title}` : `bis ${hhmm(freeNow.end)}`}</div>
        {fits && (
          <>
            <p className="t-hint">{blockName(fits)} ({fmtDur(minsBetween(fits.start, fits.end))}) passt {upcoming && upcoming.kind==="gym" ? `vor ${upcoming.title.replace("Gym · ","")}` : "jetzt"} gut rein.</p>
            <div className="btn-row"><button className="cta press" onClick={e=>startItem(fits, e)}><span className="cta-text">{fits.title}</span><span className="arr"><IconArrow size={18}/></span></button></div>
          </>
        )}
      </div>
    );
  }
  const after = now>=plan.dayEnd || !plan.items.some(i=>i.end>now && !i.cancelled);
  if(after){
    const t=fuelTotals(state.fuel);
    const done=state.queue.filter(q=>q.done && q.kind!=="gym" && taskOnDay(q, plan.iso, true)).length;
    const all=state.queue.filter(q=>q.kind!=="gym" && taskOnDay(q, plan.iso, true)).length;
    return (
      <button className="tile now press" data-area="future" onClick={()=>go("history")}>
        <div className="t-label">Tagesabschluss</div>

      </button>
    );
  }
  const first=plan.items.find(i=>i.kind!=="free" && !i.cancelled && i.start>now);
  return (
    <div className="tile now" data-area={first ? first.area : "fuel"}>
      <div className="t-label">Jetzt · vor dem Start</div>
      <h2 className="t-title">{first ? `${first.title} um ${hhmm(first.start)}` : "Freier Tag"}</h2>
      {first && <div className="t-meta">in {fmtDur(minsBetween(now, first.start))}</div>}
    </div>
  );
}

/* ================= HEUTE: Day Flow ================= */
let heuteIntroPlayed=false;
function durShort(min){
  min=Math.max(0, Math.round(min));
  const h=Math.floor(min/60), m=min%60;
  if(!h) return `${m} Min.`;
  return m ? `${h}:${pad2(m)} Std.` : `${h} Std.`;
}
/* Was heute noch ansteht – Fixtermine mit Uhrzeit, alles andere nur mit Dauer */
function buildMoves(state, plan, now){
  const moves=[];
  const R=plan.R;
  if(plan.schoolEnd && now<plan.schoolEnd){
    const left=plan.active.filter(l=>l.end>now);
    const cur=left.find(l=>now>=l.start);
    const inside=now>=plan.schoolStart;
    moves.push({key:"school", kind:"school", area:"school", fixed:true, title:"Schule",
      start: inside ? now : plan.schoolStart, end:plan.schoolEnd, time: inside ? null : hhmm(plan.schoolStart), current:inside,
      sub: cur ? `Jetzt ${cur.subject}${cur.room ? ` · ${cur.room}` : ""} · bis ${hhmm(plan.schoolEnd)}`
               : `${left.length} ${left.length===1 ? "Block" : "Blöcke"} · bis ${hhmm(plan.schoolEnd)}`});
  }
  const placedTasks=new Set();
  plan.items.forEach(i=>{
    if(i.kind==="lesson" || i.kind==="freistunde") return;
    if(i.kind==="free"){
      const len=minsBetween(i.start, i.end);
      if(len<45) return;
      const evening=i.end.getTime()===plan.dayEnd.getTime();
      moves.push({key:`free-${i.start.getTime()}`, kind:"free", area:"fuel", title: evening && i.start>now ? "Abend frei" : "Frei",
        sub: now>=i.start ? `noch ${durShort(minsBetween(now, i.end))}` : evening ? `ab ${hhmm(i.start)}` : durShort(len),
        start: now>i.start ? now : i.start, end:i.end, current: now>=i.start && now<i.end});
      return;
    }
    if(i.end<=now) return;
    if(i.kind==="gym"){
      if(i.done) return;
      moves.push({key:"gym", kind:"gym", area:"body", fixed:true, title:cap(i.gymType), time:hhmm(i.start), sub:`Gym · ${durShort(R.gymMin)}`, xp:((state.queue.find(q=>q.kind==="gym") || {}).xp) || 25,
        start:i.start, end:i.end, current:now>=i.start, item:i});
      return;
    }
    if(i.kind==="event"){
      moves.push({key:`ev-${i.event.id}`, kind:"event", area:i.area, fixed:true, title:i.title, time:hhmm(i.start),
        sub:i.event.location || "Termin", start:i.start, end:i.end, current:now>=i.start, item:i});
      return;
    }
    if(i.kind==="task"){
      placedTasks.add(i.task.id);
      moves.push({key:`t-${i.task.id}`, kind:"task", area:i.area, fixed:true, title:i.title, time:hhmm(i.start),
        sub:durShort(i.task.durationMin || 15), start:i.start, end:i.end, current:now>=i.start, task:i.task, xp:i.task.xp});
      return;
    }
    if(i.kind==="block"){
      if(i.task) placedTasks.add(i.task.id);
      moves.push(i.quest
        ? {key:"quest", kind:"quest", area:"future", title:`Future · ${state.futureQuest.category}`, sub:durShort(i.minutes), label:state.futureQuest.title, start:i.start, end:i.end, item:i, xp:state.futureQuest.xp}
        : {key:`t-${i.task.id}`, kind:"task", area:i.area, title:i.task.title, sub:durShort(i.minutes), label:i.label, start:i.start, end:i.end, task:i.task, item:i, xp:i.task.xp});
    }
  });
  const loose=openTasksToday(state).filter(q=>!q.time && !placedTasks.has(q.id));
  loose.forEach(q=>moves.push({key:`t-${q.id}`, kind:"task", area:areaOf(q), title:q.title, sub:durShort(q.durationMin || 15), label:q.subtitle, start:null, end:null, task:q, xp:q.xp}));
  if(!state.futureQuest.done && !moves.some(m=>m.kind==="quest"))
    moves.push({key:"quest", kind:"quest", area:"future", title:`Future · ${state.futureQuest.category}`, sub:durShort(R.skillMin), label:state.futureQuest.title, start:null, end:null, xp:state.futureQuest.xp});
  /* feste Reihenfolge nach Zeit; Aufgaben ohne Platz kommen vor den freien Abend */
  const timed=moves.filter(m=>m.start), open=moves.filter(m=>!m.start);
  timed.sort((a,b)=>(a.start-b.start) || (a.kind==="free")-(b.kind==="free"));
  const eveIdx=timed.findIndex(m=>m.kind==="free" && m.end.getTime()===plan.dayEnd.getTime());
  const out = eveIdx>=0 ? [...timed.slice(0,eveIdx), ...open, ...timed.slice(eveIdx)] : [...timed, ...open];
  /* leeres „Frei“ am Ende ohne folgende Moves wirkt wie Rauschen: nur als Abschluss zeigen */
  return out;
}
function doneToday(state, plan){
  const tasks=state.queue.filter(q=>q.done && q.kind!=="gym" && taskOnDay(q, state.todayISO, true)).length;
  return tasks + (state.futureQuest.done ? 1 : 0) + (plan.gymDay && plan.gymDay.done && plan.gymDay.type!=="RUHE" ? 1 : 0);
}
const FLOW_X=[.04,.24,.42,.2,.06,.34,.46,.16];
const NODE_H=50;
function layoutFlow(moves, W){
  /* Zeit als Raum: viel freie Zeit = viel Abstand */
  const nodes=[]; let y=0, xi=0;
  moves.forEach((m,i)=>{
    const prev=moves[i-1];
    if(prev){
      let gap=20;
      if(prev.kind==="free" && prev.start && prev.end) gap=minsBetween(prev.start, prev.end);
      else if(prev.end && m.start) gap=Math.max(0, minsBetween(prev.end, m.start));
      else if(!m.start) gap=8;
      y += NODE_H + 8 + Math.round(clamp(gap, 0, 360)*.18);
    }
    let fx;
    if(m.kind==="free") fx = i===0 ? .04 : Math.min(.46, (nodes[i-1] ? nodes[i-1].fx : .1) + .22);
    else { fx=FLOW_X[xi % FLOW_X.length]; xi++; }
    nodes.push({...m, fx, y, x:Math.round(fx*Math.max(0, W-200))});
  });
  return {nodes, h: nodes.length ? y + NODE_H + 6 : 0};
}
function flowPath(nodes){
  if(nodes.length<2) return "";
  const c=n=>({x:n.x+7, y:n.y+13});
  let d=`M${c(nodes[0]).x} ${c(nodes[0]).y}`;
  for(let i=1;i<nodes.length;i++){
    const a=c(nodes[i-1]), b=c(nodes[i]), dy=(b.y-a.y)*.55;
    d+=` C${a.x} ${a.y+dy} ${b.x} ${b.y-dy} ${b.x} ${b.y}`;
  }
  return d;
}
function useWidth(){
  const ref=useRef(null);
  const [w,setW]=useState(350);
  useLayoutEffect(()=>{
    const el=ref.current; if(!el) return;
    setW(el.clientWidth);
    if(typeof ResizeObserver==="undefined") return;
    const ro=new ResizeObserver(()=>setW(el.clientWidth));
    ro.observe(el);
    return ()=>ro.disconnect();
  },[]);
  return [ref, w];
}
function completable(m){ return m.kind==="task" || m.kind==="quest" || m.kind==="gym"; }
function DayFlow({moves, intro, focusKey, leaving, onOpen, onComplete}){
  const [ref, W]=useWidth();
  const {nodes, h}=layoutFlow(moves, W);
  const lead=nodes.find(n=>n.kind!=="free" && !leaving[n.key]);
  const path=flowPath(nodes);
  return (
    <div ref={ref} className={`flow ${intro ? "enter" : ""}`} style={{height:h}} aria-label="Rest des Tages">
      {path && (
        <svg className="flow-line" width={W} height={h} viewBox={`0 0 ${W} ${h}`} aria-hidden="true">
          <path d={path} style={{d:`path("${path}")`}} pathLength="1"/>
        </svg>
      )}
      {nodes.map((n,i)=>{
        const isLead=lead && n.key===lead.key;
        const state=leaving[n.key];
        return (
          <div key={n.key} data-move={n.key} data-area={n.area}
            className={`fnode ${n.kind==="free" ? "free" : ""} ${n.current ? "now" : ""} ${isLead ? "lead" : ""} ${state || ""} ${focusKey===n.key ? "focused" : ""}`}
            style={{transform:`translate3d(${n.x}px,${n.y}px,0)`, "--i":i, width:W-n.x-(completable(n) ? 48 : 0)}}>
            <span className="fdot" aria-hidden="true"/>
            <button className="fbody" onClick={e=>onOpen(n, e)} disabled={n.kind==="free"}>
              {(n.current || isLead) && n.kind!=="free" && <span className="fkick">{n.current ? "Jetzt" : "Als Nächstes"}</span>}
              <span className="ftitle">{n.time && <span className="ftime tabular">{n.time}</span>}{n.title}</span>
              <span className="fsub">{n.sub}{n.label && n.kind!=="free" ? ` · ${n.label}` : ""}</span>
            </button>
            {state==="checked" || state==="leaving" ? <span className="fxp"><CountUp to={n.xp || 0} run/></span> : null}
          </div>
        );
      })}
      {nodes.filter(completable).map(n=>(
        <button key={"c-"+n.key} className={`fcheck ${leaving[n.key] || ""}`} style={{transform:`translate3d(${W-36}px,${n.y}px,0)`, "--i":nodes.indexOf(n)}}
          onClick={()=>onComplete(n)} aria-label={`${n.title} erledigt`}>
          <IconCheck size={14}/>
        </button>
      ))}
    </div>
  );
}

/* Tap auf einen Move: der Tag tritt zurück, der Move bleibt und wird groß */
function MoveFocus({move, onClose, onStart, onDone, goPlan, closing}){
  const titleRef=useRef(null);
  useLayoutEffect(()=>{
    const el=titleRef.current;
    const src=document.querySelector(`[data-move="${CSS.escape(move.key)}"] .ftitle`);
    if(!el || !src || reducedMotion() || !el.animate) return;
    const a=src.getBoundingClientRect(), b=el.getBoundingClientRect();
    const k=a.height/b.height;
    const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-morph").trim() || "cubic-bezier(.2,.9,.2,1)";
    const frames=[{transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${k})`}, {transform:"none"}];
    const anim=el.animate(closing ? frames.slice().reverse() : frames, {duration: closing ? MOTION.state+80 : MOTION.morph+60, easing:ease, fill:"both"});
    return ()=>anim.cancel();
  },[closing]);
  const startable = move.kind==="task" || move.kind==="quest";
  return (
    <div className={`move-layer ${closing ? "out" : ""}`} role="dialog" aria-label={move.title}>
      <button className="icon-btn press move-close" onClick={onClose} aria-label="Zurück zum Tag"><IconX size={18}/></button>
      <div className="move-inner" data-area={move.area}>
        <div className="move-kick">{move.kind==="quest" ? "Zukunft" : move.label || AREA_LABEL[move.area] || "Heute"}</div>
        <h2 ref={titleRef} className="move-title">{move.kind==="quest" ? move.label : move.title}</h2>
        <div className="move-meta tabular">{move.time ? `${move.time} · ` : ""}{move.sub}</div>
        <div className="move-actions">
          {startable && <button className="btn-cta press" onClick={()=>onStart(move, titleRef.current)} aria-label={move.kind==="quest" ? "Quest starten" : "Start"}><IconPlay/> Start</button>}
          {completable(move) && <button className="btn-soft press" onClick={()=>onDone(move)}><IconCheck size={16}/> {move.kind==="gym" ? "Training erledigt" : "Erledigt"}</button>}
          {!startable && !completable(move) && <button className="btn-soft press" onClick={goPlan}>Im Plan ansehen</button>}
        </div>
      </div>
    </div>
  );
}

function HeuteScreen({state, dispatch, go, theme, toggleTheme, startFocus, plan, now, events, cal, weather, steps, openAdd}){
  const R=plan.R;
  const [intro]=useState(()=>{ const first=!heuteIntroPlayed; heuteIntroPlayed=true; return first; });
  const [leaving,setLeaving]=useState({});
  const [focusMove,setFocusMove]=useState(null);
  const [closing,setClosing]=useState(false);
  const moves=buildMoves(state, plan, now).filter(m=>!(leaving[m.key]==="gone"));
  const actionable=moves.filter(m=>m.kind!=="free" && !leaving[m.key]);
  const n=actionable.length;
  const done=doneToday(state, plan);
  const fq=state.futureQuest;
  const t=fuelTotals(state.fuel);
  const xpToday=state.xpDay && state.xpDay.date===state.todayISO ? state.xpDay.xp : 0;
  const soonEvents=events.filter(e=>!isStepsEvent(e) && startOfDay(e.start)>startOfDay(now)).slice(0,4);
  const late=now.getHours()>=21 || now>=plan.dayEnd;
  let heroA, heroB;
  if(n===0){ heroA="Heute"; heroB="Geschafft."; }
  else if(n===1){ heroA="Noch"; heroB="1 Move."; }
  else if(late){ heroA="Noch"; heroB=`${n} Dinge.`; }
  else { heroA="Heute noch"; heroB=`${n} Moves.`; }
  const gymLine = plan.gymDay && plan.gymDay.type!=="RUHE" ? `${cap(plan.gymDay.type)} ${plan.gymDay.done ? "erledigt" : "heute"}` : "Ruhetag";

  function finish(m){
    if(m.kind==="gym"){
      const qg=state.queue.find(q=>q.kind==="gym" && !q.done);
      if(qg) dispatch({type:"COMPLETE_QUEUE_ITEM", id:qg.id});
      else if(plan.gymDay && !plan.gymDay.done) dispatch({type:"TOGGLE_GYM_DAY", day:plan.gymDay.day});
    } else if(m.kind==="quest") dispatch({type:"COMPLETE_QUEST"});
    else if(m.task) dispatch({type:"COMPLETE_QUEUE_ITEM", id:m.task.id});
  }
  function complete(m){
    if(leaving[m.key]) return;
    m.kind==="gym" ? Haptics.success() : Haptics.light();
    const set=(v)=>setLeaving(l=>({...l, [m.key]:v}));
    if(reducedMotion()){ finish(m); return; }
    set("checked");
    setTimeout(()=>set("leaving"), 520);
    setTimeout(()=>{ finish(m); setLeaving(l=>{ const c={...l}; delete c[m.key]; return c; }); }, 860);
  }
  function open(m){
    if(m.kind==="free") return;
    Haptics.light();
    setClosing(false); setFocusMove(m);
  }
  function close(after){
    if(!focusMove) return;
    if(reducedMotion()){ setFocusMove(null); after && after(); return; }
    setClosing(true);
    setTimeout(()=>{ setFocusMove(null); setClosing(false); after && after(); }, MOTION.state+60);
  }
  function start(m, titleEl){
    if(titleEl) titleEl.style.viewTransitionName="focus-title";
    if(m.kind==="quest") startFocus(fq.id, "quest", R.skillMin);
    else if(m.task) startFocus(m.task.id, "queue", isNoDisc(m.task) ? R.noDiscMin : (m.task.durationMin || 15));
  }
  function doneFromFocus(m){ close(()=>complete(m)); }

  return (
    <div className="screen heute">
      <div className={`stack ${focusMove && !closing ? "recede" : ""}`}>
        <div className="topbar">
          <span className="date">{formatDate(now)} · <span className="tabular">{hhmm(now)}</span>{weather && weather.data && weather.status!=="blocked" ? <span className="wx"> · {weatherLabel(weather.data)}</span> : null}</span>
          <div className="row">
            <button className="icon-btn press" onClick={()=>openAdd({date:state.todayISO})} aria-label="Aufgabe hinzufügen"><IconPlus size={19}/></button>
            <button className="icon-btn press" onClick={toggleTheme} aria-label={theme==="dark" ? "Hell-Modus" : "Dunkel-Modus"}>
              {theme==="dark" ? <IconSun size={19}/> : <IconMoon size={18}/>}
            </button>
          </div>
        </div>

        <section className={`hero day-hero ${intro ? "intro" : ""}`} data-parallax=".14">
          <div className="dh-a">{heroA}</div>
          <h1 className="dh-b">{n>0 ? <><span className="dh-n tabular">{heroB.split(" ")[0]}</span> {heroB.split(" ").slice(1).join(" ")}</> : heroB}</h1>
          <p className="dh-sub">
            {plan.freeRemaining>0 ? <b>{fmtDur(plan.freeRemaining)} frei</b> : "Keine freie Zeit mehr"}
            {done>0 ? ` · ${done} erledigt` : ""}{xpToday>0 ? ` · +${xpToday} XP` : ""}
          </p>
          {(plan.changes.length>0 || plan.freeDelta>0) && (
            <button className="change-line press" onClick={()=>go("plan")}>
              <span className="pulse-dot"/>
              {plan.changes.length} {plan.changes.length===1 ? "Änderung" : "Änderungen"} im Stundenplan
              {plan.freeDelta>0 && <b> · +{fmtDur(plan.freeDelta)} frei</b>}
            </button>
          )}
        </section>

        {moves.length>0
          ? <DayFlow moves={moves} intro={intro} focusKey={focusMove && focusMove.key} leaving={leaving} onOpen={open} onComplete={complete}/>
          : <p className="flow-empty">Der Rest des Tages gehört dir.</p>}

        <button className="line-row press status-row" data-area="body" onClick={()=>go("body")}>
          <span className="label">Körper</span>
          <span className="line-main">
            <span className="line-big tabular" style={{viewTransitionName:"steps-num"}}>{de(steps.value)}</span> Schritte · {gymLine}
            <span className="status-meta">{t.protein} g Protein · Future {fq.done ? "✓" : "offen"}</span>
          </span>
          <IconChevron size={18}/>
        </button>

        <Disclosure label="Mehr" meta={soonEvents.length ? `${soonEvents.length} Termine` : ""}>
          <CalNote cal={cal}/>
          {plan.allDay.length>0 && <div className="chips" style={{margin:"6px 0 10px"}}>{plan.allDay.map(e=><span key={e.id} className="chip on" style={{"--area":"var(--focus)"}}><i/>{e.title}</span>)}</div>}
          {soonEvents.map(e=>(
            <div key={e.id} className="event-row">
              <div className="event-when tabular">{WD_SHORT[e.start.getDay()]}, {e.start.getDate()}.<br/>{e.allDay ? "ganztägig" : hhmm(e.start)}</div>
              <div style={{minWidth:0}}><div className="event-title">{e.title}</div>{e.location && <div className="event-sub">{e.location}</div>}</div>
            </div>
          ))}
          {!fq.done && !fq.rerolled && (
            <div className="wait-row"><span>Future Quest: {fq.title}</span><button className="mini-btn press" onClick={()=>{ haptic(); dispatch({type:"REROLL_QUEST", quest:pickQuest(fq.title)}); }} aria-label="Andere Quest"><IconShuffle size={15}/></button></div>
          )}
          {state.wartetAuf.length>0 && (
            <div style={{marginTop:12}}>
              <div className="label">Wartet auf</div>
              {state.wartetAuf.map(w=>(
                <div key={w.id} className="wait-row"><span style={{fontWeight:600}}>{w.title}</span><span className="muted">{w.subtitle}</span></div>
              ))}
            </div>
          )}
        </Disclosure>
      </div>
      {focusMove && <MoveFocus move={focusMove} closing={closing} onClose={()=>close()} onStart={start} onDone={doneFromFocus} goPlan={()=>close(()=>go("plan"))}/>}
    </div>
  );
}

/* ================= FOCUS ================= */
function FocusMode({state, dispatch, go, minimize}){
  const info=focusInfo(state);
  if(!info){
    return (
      <div className="focus" data-area="focus">
        <div className="focus-top"><button className="icon-btn press" onClick={()=>go("heute")} aria-label="Schließen"><IconX size={18}/></button></div>
        <div className="focus-center"><p className="muted">Keine Fokus-Session aktiv.</p></div>
      </div>
    );
  }
  return (
    <div className="focus" data-area={info.area}>
      <div className="focus-glow"/>
      <div className="focus-top">
        <button className="icon-btn press" onClick={minimize} aria-label="Minimieren, Timer läuft weiter"><IconDown size={20}/></button>
        <span className="focus-kicker">{info.label}</span>
        <button className="icon-btn press" onClick={()=>{ dispatch({type:"CANCEL_FOCUS"}); go("heute"); }} aria-label="Abbrechen"><IconX size={18}/></button>
      </div>
      <div className="focus-center">
        <h1 className="focus-title" style={{viewTransitionName:"focus-title"}}>{info.title}</h1>
        <Ring value={info.pct} size={250} stroke={10} color="var(--area)">
          <div className="focus-time tabular" role="timer" aria-label={`${info.mm} Minuten ${info.ss} Sekunden`}>
            <Odometer value={info.mm}/><span style={{opacity:.4, margin:"0 2px"}}>:</span><Odometer value={info.ss}/>
          </div>
        </Ring>
        <div className="focus-xp">{info.done ? "Zeit um. Stark." : `+${info.xp} XP, wenn du fertig bist`}</div>
      </div>
      <div className="focus-actions">
        <button className="btn-soft press" disabled={info.done} onClick={()=>{ haptic(); dispatch({type: info.running ? "PAUSE_FOCUS" : "RESUME_FOCUS"}); }}>
          {info.running ? <IconPause/> : <IconPlay/>}{info.running ? "Pause" : "Weiter"}
        </button>
        <button className="btn-cta press" onClick={()=>{ haptic(15); go("heute", null, ()=>dispatch({type:"FINISH_FOCUS"})); }}>
          <IconCheck size={17}/> {state.focus && state.focus.source==="skill" ? "Session erledigt" : "Fertig"}
        </button>
      </div>
    </div>
  );
}

/* ================= PLAN ================= */
function LessonSheet({lesson, date, dispatch, onClose}){
  const [room,setRoom]=useState(lesson.change==="room" ? lesson.room : "");
  const iso=todayISO(date);
  function set(change, extra){
    Haptics.light();
    withTransition(change==="cancelled" ? "cancel" : "state", ()=>flushSync(()=>{ dispatch({type:"SET_SCHOOL_CHANGE", date:iso, from:lesson.from, change, ...(extra || {})}); onClose(); }));
  }
  return (
    <Sheet title={`${lesson.subject} · ${hhmm(lesson.start)}–${hhmm(lesson.end)}`} onClose={onClose}>
      <p className="muted" style={{marginBottom:14, fontSize:14}}>
        {WEEKDAYS[date.getDay()]}, {date.getDate()}. {MONTHS[date.getMonth()]} · {lesson.origRoom || lesson.room ? `Raum ${lesson.origRoom || lesson.room} · ` : ""}{lesson.teacher}
        {lesson.change ? ` · Änderung: ${lesson.change==="cancelled" ? "fällt aus" : `Raum ${lesson.room}`} (${lesson.changeSource})` : ""}
      </p>
      <div className="sheet-actions">
        {!lesson.cancelled && <button className="btn-cta press" onClick={()=>set("cancelled")}>Fällt aus</button>}
        <div className="row" style={{gap:8}}>
          <input id="lesson-room" className="field" style={{height:52}} placeholder="Neuer Raum, z. B. d210" value={room} onChange={e=>setRoom(e.target.value)}/>
          <button className="btn-soft press" style={{height:52, padding:"0 18px", flexShrink:0}} disabled={!room.trim()} onClick={()=>set("room", {room:room.trim()})}>Raum</button>
        </div>
        {lesson.change && <button className="btn-soft press" onClick={()=>set("restore")}>Änderung zurücksetzen</button>}
      </div>
      <p className="fineprint" style={{marginTop:14}}>IServ ist noch nicht verbunden. Änderungen trägst du hier oder über NICO AI ein.</p>
    </Sheet>
  );
}
function GymSheet({block, gymDay, date, state, dispatch, onClose}){
  const iso=todayISO(date);
  const [time,setTime]=useState(block ? hhmm(block.start) : routine(state).gymTime);
  const isToday=iso===state.todayISO;
  function done(){
    haptic(15);
    const qg=state.queue.find(q=>q.kind==="gym" && !q.done);
    if(isToday && qg) dispatch({type:"COMPLETE_QUEUE_ITEM", id:qg.id});
    else dispatch({type:"TOGGLE_GYM_DAY", day:gymDay.day});
    onClose();
  }
  return (
    <Sheet title={`Gym · ${cap(gymDay.type)}`} onClose={onClose}>
      <p className="muted" style={{marginBottom:14, fontSize:14}}>{WEEKDAYS[date.getDay()]} · dauert bei dir etwa {fmtDur(routine(state).gymMin)}</p>
      <div className="sheet-actions">
        <div className="row" style={{gap:8}}>
          <input id="gym-time" type="time" className="field" style={{height:52}} value={time} onChange={e=>setTime(e.target.value)}/>
          <button className="btn-cta press" style={{height:52, width:"auto", padding:"0 20px"}} onClick={()=>{ dispatch({type:"SET_GYM_PLAN", date:iso, value:time}); onClose(); }}>Uhrzeit</button>
        </div>
        {!gymDay.done && isToday && <button className="btn-soft press" onClick={done}>Training erledigt</button>}
        <button className="btn-soft press" onClick={()=>{ dispatch({type:"SET_GYM_PLAN", date:iso, value:"skip"}); onClose(); }}>An dem Tag kein Gym</button>
        {(state.gymPlan || {})[iso] && <button className="btn-soft press" onClick={()=>{ dispatch({type:"SET_GYM_PLAN", date:iso, value:null}); onClose(); }}>Zurück auf Standard</button>}
      </div>
    </Sheet>
  );
}
function EventSheet({event, dispatch, onClose, removeEvent}){
  const [confirm,setConfirm]=useState(false);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  async function del(){
    if(!confirm){ setConfirm(true); return; }
    setBusy(true); setErr("");
    try{ await removeEvent(event); onClose(); }
    catch(e){ setErr("Löschen hat nicht geklappt. Versuch es später nochmal."); setBusy(false); }
  }
  return (
    <Sheet title={event.title} onClose={onClose}>
      <p className="muted" style={{marginBottom:14, fontSize:14}}>
        {WEEKDAYS[event.start.getDay()]}, {event.start.getDate()}. {MONTHS[event.start.getMonth()]} · {event.allDay ? "ganztägig" : `${hhmm(event.start)}–${hhmm(event.end)}`}
        {event.location ? ` · ${event.location}` : ""} · {event.source==="google" ? "Google Kalender" : event.googleId ? "NICO OS + Google Kalender" : "NICO OS"}
      </p>
      {err && <p className="note" style={{marginBottom:10}}>{err}</p>}
      <button className="btn-soft press" disabled={busy} onClick={del} style={confirm ? {background:"var(--body)", color:"#fff"} : null}>
        {busy ? "Lösche …" : confirm ? "Wirklich löschen?" : "Termin löschen"}
      </button>
    </Sheet>
  );
}

function PlanScreen({state, dispatch, now, openAdd, removeEvent}){
  const today=startOfDay(now);
  const [weekOff,setWeekOff]=useState(0);
  const [sel,setSel]=useState(()=>(new Date().getDay()+6)%7);
  const [sheet,setSheet]=useState(null);
  const [showPast,setShowPast]=useState(false);
  const monday=addDays(mondayOf(today), weekOff*7);
  const days=[0,1,2,3,4,5,6].map(i=>addDays(monday,i));
  const date=days[sel];
  const cal=useCalendar(todayISO(monday), 7, state.connections.google.enabled);
  const events=mergedEvents(state, cal);
  const kw=isoWeek(monday), wt=weekType(monday);
  const isToday=sameDay(date, today);
  const plan=dayPlan(state, date, events, now);
  const fq=state.futureQuest;
  const gym=gymCount(state);
  const dayTasks=state.queue.filter(q=>q.kind!=="gym" && taskOnDay(q, todayISO(date), isToday));
  const allRows=plan.items.filter(i=>!(isToday && i.kind==="free" && i.end<=now));
  const pastRows=isToday ? allRows.filter(i=>i.end<=now) : [];
  const rows=isToday && !showPast ? allRows.filter(i=>i.end>now) : allRows;
  const seen={};
  const rowName=(i)=>{
    const base = i.kind==="free" ? "free" : i.kind==="gym" ? "gym" : vtSlug(i.title);
    seen[base]=(seen[base] || 0)+1;
    return `arow-${base}-${seen[base]}`;
  };
  const cancelledSpan=plan.lessons.filter(l=>l.cancelled);
  const pillFor=(i)=>{
    if(i.kind!=="free" && i.kind!=="freistunde") return null;
    if(i.kind==="free" && plan.freeDelta>0 && plan.schoolEnd && i.start.getTime()===plan.schoolEnd.getTime()) return `+${fmtDur(plan.freeDelta)} frei`;
    const gain=cancelledSpan.reduce((a,l)=>a+Math.max(0, minsBetween(l.start<i.start ? i.start : l.start, l.end>i.end ? i.end : l.end)),0);
    return gain>0 ? `+${fmtDur(gain)} frei` : null;
  };
  const count=(d)=> lessonsOn(d).length + events.filter(e=>eventOnDay(e,d) && !isStepsEvent(e)).length + state.queue.filter(q=>q.date===todayISO(d)).length;

  function shiftWeek(n){ haptic(); withTransition(n>0 ? "forward" : "back", ()=>flushSync(()=>setWeekOff(w=>w+n))); }
  function pickDay(i){ if(i===sel) return; Haptics.light(); withTransition(i>sel ? "day-fwd" : "day-back", ()=>flushSync(()=>setSel(i))); }
  function jumpToday(){ haptic(); withTransition("back", ()=>flushSync(()=>{ setWeekOff(0); setSel((today.getDay()+6)%7); })); }
  function tap(i){
    if(i.kind==="lesson") setSheet({type:"lesson", lesson:i.lesson});
    else if(i.kind==="gym") setSheet({type:"gym", block:i});
    else if(i.kind==="event") setSheet({type:"event", event:i.event});
  }

  return (
    <div className="screen">
      <div className="stack">
        <div className="row" style={{justifyContent:"space-between", alignItems:"flex-end"}}>
          <div>
            <h1 className="page-title">Plan</h1>
            <p className="page-sub">KW {kw} · {wt}-Woche</p>
          </div>
          <button className="icon-btn press" onClick={()=>openAdd({date:todayISO(date)})} aria-label="Eintrag hinzufügen"><IconPlus size={20}/></button>
        </div>

        <div className="weeknav">
          <button className="icon-btn press" onClick={()=>shiftWeek(-1)} aria-label="Vorige Woche"><IconBack size={18}/></button>
          <div className="wk">
            <div>{shortRange(days[0], days[6])}</div>
            {weekOff!==0 && <button className="chip press" style={{minHeight:30, marginTop:6}} onClick={jumpToday}>Zu heute</button>}
          </div>
          <button className="icon-btn press" onClick={()=>shiftWeek(1)} aria-label="Nächste Woche"><IconChevron size={18}/></button>
        </div>

        <div className="daystrip" role="tablist" aria-label="Tag wählen" style={{"--sel":sel, ...vt("daystrip", "live")}}>
          <span className="day-ind" aria-hidden="true"/>
          {days.map((d,i)=>(
            <button key={i} role="tab" aria-selected={i===sel}
              className={`dayb press ${i===sel ? "on" : ""} ${sameDay(d,today) ? "today" : ""}`}
              onClick={()=>pickDay(i)} aria-label={`${WEEKDAYS[d.getDay()]}, ${d.getDate()}.`}>
              <small>{WD_SHORT[d.getDay()].toUpperCase()}</small>{d.getDate()}
              {count(d)>0 && <i/>}
            </button>
          ))}
        </div>

        <div>
          <div className="plan-summary">
            <div>
              <div className="label">{isToday ? "Heute" : `${WEEKDAYS[date.getDay()]}, ${date.getDate()}. ${MONTHS[date.getMonth()]}`}</div>
              <div className="plan-free tabular">{fmtDur(plan.freeRemaining)} <span>{isToday ? "noch frei" : "frei"}</span></div>
            </div>
            <div className="plan-facts">
              {plan.schoolEnd ? <span>Schule bis {hhmm(plan.schoolEnd)}</span> : <span>Keine Schule</span>}
              {plan.freeDelta>0 && <span className="pos plan-delta" style={vt("plan-delta", "pop")}>+{fmtDur(plan.freeDelta)} durch Ausfall</span>}
            </div>
          </div>
          {cal.status==="loading" && <p className="note" style={{marginBottom:8}}>Kalender wird geladen …</p>}
          <CalNote cal={cal}/>
          {plan.allDay.length>0 && (
            <div className="chips" style={{margin:"8px 0"}}>
              {plan.allDay.map(e=><button key={e.id} className="chip on press" style={{"--area":"var(--focus)"}} onClick={()=>setSheet({type:"event", event:e})}><i/>{e.title}</button>)}
            </div>
          )}
          {rows.length===0 && <p className="note" style={{marginTop:8}}>Nichts eingetragen.</p>}
          {isToday && <div className="label" style={{margin:"6px 0 2px"}}>Heute noch</div>}
          {pastRows.length>0 && (
            <button className="past-toggle press" onClick={()=>{ Haptics.light(); withTransition("state", ()=>flushSync(()=>setShowPast(v=>!v))); }}>
              <span>{pastRows.length} vorbei</span><span>{showPast ? "ausblenden" : "anzeigen"}</span>
            </button>
          )}
          <div className="agenda">
            {rows.map(i=>(
              <AgendaRow key={i.key} item={i} now={isToday ? now : new Date(0)} name={rowName(i)} pill={pillFor(i)}
                onTap={i.kind==="lesson" || i.kind==="gym" || i.kind==="event" ? ()=>tap(i) : null}/>
            ))}
          </div>
          <p className="fineprint" style={{textAlign:"left", marginTop:8}}>Tipp: Stunde antippen, um einen Ausfall oder Raumwechsel einzutragen.</p>
        </div>

        {dayTasks.length>0 && (
          <div>
            <div className="section-head"><span className="label">Aufgaben {isToday ? "heute" : "an dem Tag"}</span></div>
            {dayTasks.map(item=>(
              <div key={item.id} className={`plan-row ${item.done ? "done" : ""}`} data-area={areaOf(item)}>
                <span className="plan-bar"/>
                <span className="plan-time tabular">{item.time || "—"}</span>
                <div style={{flex:1, minWidth:0}}>
                  <div className="plan-title">{item.title}</div>
                  <div className="muted" style={{fontSize:12, marginTop:2}}>
                    {AREA_LABEL[areaOf(item)]} · {fmtDur(isNoDisc(item) ? routine(state).noDiscMin : item.durationMin)}{item.due ? ` · fällig ${item.due.slice(8,10)}.${item.due.slice(5,7)}.` : ""}{item.date && item.date<todayISO(date) ? " · überfällig" : ""}
                  </div>
                </div>
                {item.done
                  ? <button className="plan-check press" onClick={()=>dispatch({type:"REOPEN_TASK", id:item.id})} aria-label="Wieder öffnen"><IconCheck size={12}/></button>
                  : <button className="check press" onClick={()=>{ haptic(10); dispatch({type:"COMPLETE_QUEUE_ITEM", id:item.id}); }} aria-label={`${item.title} abhaken`}><IconCheck size={13}/></button>}
              </div>
            ))}
            {isToday && (
              <div className={`plan-row ${fq.done ? "done" : ""}`} data-area="future">
                <span className="plan-bar"/>
                <span className="plan-time" style={{color:"var(--future)", fontWeight:700, fontSize:11}}>ZUKFT</span>
                <div style={{flex:1, minWidth:0}}><div className="plan-title">{fq.title}</div></div>
                {fq.done ? <span className="plan-check"><IconCheck size={12}/></span> : <span className="muted" style={{fontSize:12, fontWeight:700}}>+{fq.xp}</span>}
              </div>
            )}
          </div>
        )}

        <div>
          <div className="section-head" style={{marginBottom:12}}><span className="label">Training diese Woche</span><span className="label tabular">{gym.done}/{gym.total}</span></div>
          <div className="week">
            {state.body.gym.map(g=>(
              <button key={g.day} className={`day press ${g.done ? "on" : ""} ${g.type==="RUHE" ? "rest" : ""}`} disabled={g.type==="RUHE"}
                onClick={()=>{ haptic(); dispatch({type:"TOGGLE_GYM_DAY", day:g.day}); }}
                aria-pressed={g.done} aria-label={`${g.day} ${g.type}`}>
                {g.day}<small>{g.type==="RUHE" ? "—" : g.type}</small>
              </button>
            ))}
          </div>
        </div>
      </div>

      {sheet && sheet.type==="lesson" && <LessonSheet lesson={sheet.lesson} date={date} dispatch={dispatch} onClose={()=>setSheet(null)}/>}
      {sheet && sheet.type==="gym" && plan.gymDay && <GymSheet block={sheet.block} gymDay={plan.gymDay} date={date} state={state} dispatch={dispatch} onClose={()=>setSheet(null)}/>}
      {sheet && sheet.type==="event" && <EventSheet event={sheet.event} dispatch={dispatch} removeEvent={removeEvent} onClose={()=>setSheet(null)}/>}
    </div>
  );
}

function SkillsScreen({state, go}){

  const today=state.todayISO;
  const doneToday=state.skills.filter(s=>(s.sessions || []).some(x=>x.date===today)).length;
  useForgetOpen("skills");
  return (
    <AnimatedPage>
      <header data-parallax=".12">
        <h1 className="page-title">Skills</h1>
        <p className="page-sub">15 Minuten am Tag · {doneToday ? `${doneToday} heute trainiert` : "heute noch keine Session"}</p>
      </header>
      <div className="xlist sk-list">
        {state.skills.map((s,i)=>{
          const focus=s.focus || (s.nodes.find(n=>n.status==="current") || {}).title || "Gemeistert";
          return (
            <button key={s.id} data-row="" className="sk-row press" style={vt(`skill-row-${s.id}`, rowClass(i, si))}
              onClick={e=>{ markRows(e.currentTarget); lastOpen.skills=s.id; Haptics.light(); go("skill-detail", s.id); }}>

              <span className="sk-main">
                <span className="sk-top">
                  <SharedTitle id={`skill-${s.id}`} as="span" className="sk-name">{s.name}</SharedTitle>
                  <span className="sk-lvl"><small>LVL</small><SharedMetric id={`skill-lvl-${s.id}`} value={s.level} className="lvl-num"/></span>
                </span>
                <span className="sk-focus">{focus}{(s.sessions || []).some(x=>x.date===today) ? " · heute ✓" : ""}</span>
                <Bar value={s.xp/(s.xpToNext || SKILL_XP_START)*100} color="var(--focus)" name={`skill-bar-${s.id}`} cls="bar-morph"/>
              </span>
            </button>
          );
        })}
      </div>

}
function SkillDetail({state, dispatch, back, id, startFocus}){
  const i=state.skills.findIndex(s=>s.id===id);
  const skill=state.skills[i];
  const [shift,setShift]=useState(0);
  const [justDone,setJustDone]=useState(false);
  if(!skill) return <div className="screen"><SubHeader title="Skill" onBack={back}/></div>;
  const done=skill.nodes.filter(n=>n.status==="completed").length;
  const sessions=skill.sessions || [];
  const today=state.todayISO;
  const todayCount=sessions.filter(x=>x.date===today).length;
  const weekStart=todayISO(mondayOf(dateFromISO(today)));
  const weekMin=sessions.filter(s=>s.date>=weekStart).reduce((a,s)=>a+(s.minutes || 0),0);
  const running=state.focus && state.focus.source==="skill" && state.focus.targetId===skill.id;
  const session=skillSession(skill, today, shift);
  const xpTo=skill.xpToNext || SKILL_XP_START;
  function markDone(){
    Haptics.success();
    withTransition("state", ()=>flushSync(()=>{
      dispatch({type:"LOG_SKILL_SESSION", skillId:skill.id, minutes:session.minutes, kind:session.kind, title:session.title});
      setJustDone(true); setShift(0);
    }));
  }
  return (
    <AnimatedPage area="focus">
      <SubHeader title="Skill" onBack={back}/>
      <div>
        <SharedMetric id={`skill-num-${skill.id}`} value={pad2(i+1)} className="sk-num big"/>
        <div className="skd-head">
          <SharedTitle id={`skill-${skill.id}`} className="page-title skd-name">{skill.name}</SharedTitle>
          <span className="skd-lvl"><small>LVL</small><SharedMetric id={`skill-lvl-${skill.id}`} value={skill.level} className="lvl-num"/></span>
        </div>
        <Bar value={skill.xp/xpTo*100} color="var(--focus)" name={`skill-bar-${skill.id}`} cls="bar-morph" thick instant/>
        <div className="row" style={{justifyContent:"space-between", marginTop:10}}>
          <span className="muted tabular" style={{fontSize:13}}>{skill.xp} / {xpTo} XP</span>
          <span className="muted" style={{fontSize:13}}>{skill.focus || ""}</span>
        </div>
      </div>

      <section className="session" style={vt("skill-session", "txt")}>
        <div className="session-kick"><span className="tabular">{session.minutes} Min.</span> · {session.kind==="learn" ? "Lernen" : "Mission"}</div>
        {session.kind==="learn" && session.video ? (
          <a className="session-video" href={session.video.url} target="_blank" rel="noopener noreferrer">
            {session.video.thumb && <img src={session.video.thumb} alt=""/>}
            <span className="session-dur tabular">{session.video.duration}</span>
          </a>
        ) : null}
        <p className="session-title">{session.title}</p>
        {SAFETY_NOTE[skill.id] && <p className="session-safe">{SAFETY_NOTE[skill.id]}</p>}
        {todayCount>0 && <p className="session-done"><span className="ck"><IconCheck size={12}/></span>{justDone ? `Session erledigt · +${SKILL_SESSION_XP} XP` : `Heute ${todayCount === 1 ? "eine Session" : `${todayCount} Sessions`} erledigt`}</p>}
        <div className="session-actions">
          <button className="btn-cta press" onClick={e=>{
              if(running){ back(); return; }

const AI_PROMPT=`Du bist die Food-Erkennung einer Ernährungs-App. Das Bild ist ein Foto einer Mahlzeit.

Aufgabe:
1. Erkenne jede sichtbare Komponente (höchstens 8). Ist eine Marke/Verpackung klar erkennbar, nenne das Markenprodukt (z. B. "Barilla Pomodoro").
2. Schätze die Portion jeder Komponente in Gramm anhand von Tellergröße, Besteck und typischen Portionen.
3. Gib typische Nährwerte pro 100 g an, so zubereitet wie auf dem Foto: kcal, Protein, Kohlenhydrate, Fett (in g). Orientiere dich an Werten, wie sie in USDA FoodData Central stehen, bei klar erkennbaren Markenprodukten an typischen Herstellerangaben.
4. "source": "usda" für generische Lebensmittel, "brand" für erkennbare Markenprodukte, "product" für typische Fertigprodukte ohne erkennbare Marke, "estimate" wenn du unsicher bist.
5. "cookingFat": true, wenn das Essen wahrscheinlich in Öl oder Butter gebraten wurde (Fett sieht man auf Fotos kaum).
6. "confidence": 0 bis 1, wie sicher die Erkennung ist.
Namen auf Deutsch, kurz (1–3 Wörter). Ist kein Essen zu sehen, gib "items": [] zurück.

Antworte NUR mit JSON in genau dieser Form, "name" jeweils als erstes Feld:
{"items":[{"name":"Hähnchenbrust","confidence":0.94,"source":"usda","grams":160,"per100":{"kcal":165,"protein":31,"carbs":0,"fat":3.6}}],"cookingFat":false}`;

function numIn(v,min,max,def){ const n=Number(v); return Number.isFinite(n) ? clamp(n,min,max) : def; }
function round5(n){ return Math.max(5, Math.round(n/5)*5); }
function sanitizeAi(raw){
  const list = raw && Array.isArray(raw.items) ? raw.items : [];
  const items = list.slice(0,8).filter(it=>it && typeof it==="object").map(it=>{
    const p = (it.per100 && typeof it.per100==="object") ? it.per100 : {};
    return {
      name: String(it.name||"Unbekannt").slice(0,40),
      conf: Math.round(numIn(it.confidence,0,1,.5)*100),
      src: ["usda","brand","product","estimate"].includes(it.source) ? it.source : "estimate",
      grams: round5(numIn(it.grams,5,2000,100)),
      per100:{kcal:numIn(p.kcal,0,950,0), protein:numIn(p.protein,0,100,0), carbs:numIn(p.carbs,0,100,0), fat:numIn(p.fat,0,100,0)},
    };
  });
  return {items, cookingFat: !!(raw && raw.cookingFat)};
}
function nutritionRows(items, grams, oil){
  const rows = items.map((it,i)=>{
    const g = grams[i]!=null ? grams[i] : it.grams;
    return {name:it.name, g, src:it.src, kcal:it.per100.kcal*g/100, protein:it.per100.protein*g/100, carbs:it.per100.carbs*g/100, fat:it.per100.fat*g/100};
  });
  if(oil){ const o=OIL_ITEM; rows.push({name:o.name, g:o.grams, src:o.src, kcal:o.per100.kcal*o.grams/100, protein:0, carbs:0, fat:o.per100.fat*o.grams/100}); }
  return rows;
}
function sumRows(rows){
  const t=rows.reduce((a,r)=>({kcal:a.kcal+r.kcal, protein:a.protein+r.protein, carbs:a.carbs+r.carbs, fat:a.fat+r.fat}), {kcal:0,protein:0,carbs:0,fat:0});
  const kcal=Math.round(t.kcal);
  return {kcal, protein:Math.round(t.protein), carbs:Math.round(t.carbs), fat:Math.round(t.fat),
    min:Math.round(kcal*0.91/10)*10, max:Math.round(kcal*1.10/10)*10};
}
