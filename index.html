  --g-body:linear-gradient(135deg,#FF5A36,#FF9A2E);
  --g-fuel:linear-gradient(135deg,#0FAF6B,#12938F);
  --school:#B07D00; --g-school:linear-gradient(135deg,#FFE14D,#FFB020); --school-label:#9A6B00; --hl:rgba(255,214,0,.55);
  /* tiles: white in Solar, full gradient in Chroma */
  --tile-g:0;
  --tile-ink-o:initial; --tile-muted-o:initial; --tile-label-o:initial; --tile-line-o:initial;
  --glow-opacity:.22;
  --core:#0A0A0A;
  --nav-shadow:0 10px 30px -18px rgba(40,25,10,.28);
  /* Motion-Tokens (Fallback; echte Spring-Kurven setzt das Motion-System per JS) */
  --ease-morph:cubic-bezier(.2,.9,.2,1); --ease-snappy:cubic-bezier(.2,.8,.2,1); --ease-soft:cubic-bezier(.25,.9,.25,1);
  --dur-micro:180ms; --dur-state:280ms; --dur-morph:480ms; --dur-sig:650ms;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#000000; --surface:#111114; --surface-2:#1C1C21; --line:#24242A; --track:#1F1F25;
    --ink:#FFFFFF; --muted:#8E8E98; --faint:#56565E;
    --accent:#FF6A3D;
    --cta-bg:#FFFFFF; --cta-ink:#0A0A0A; --arr-bg:#0A0A0A;
    --nav-bg:rgba(24,24,28,.86); --nav-line:rgba(255,255,255,.07); --nav-active-bg:#FFFFFF; --nav-active-ink:#0A0A0A;
    --island-line:rgba(255,255,255,.12);
    --shadow:none; --nav-shadow:none;
    --font-display:"Unbounded","Arial Black",sans-serif;
    --font-body:"Geist","Helvetica Neue",Arial,sans-serif;
    --hero-size:86px; --h1-size:32px; --title-size:22px;
    --display-weight:700; --title-weight:600; --display-track:-.045em; --title-track:-.02em;
    --focus:#5B8CFF; --future:#C27BFF; --body:#FF8A4C; --fuel:#3FD99A;
    --school:#FFD84D; --school-label:rgba(17,17,16,.62); --hl:rgba(255,255,255,.6);
    --tile-g:1;
    --tile-ink-o:#FFFFFF; --tile-muted-o:rgba(255,255,255,.8); --tile-label-o:rgba(255,255,255,.78); --tile-line-o:rgba(255,255,255,.4);
    --glow-opacity:.5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#000000; --surface:#111114; --surface-2:#1C1C21; --line:#24242A; --track:#1F1F25;
  --ink:#FFFFFF; --muted:#8E8E98; --faint:#56565E;
  --accent:#FF6A3D;
  --cta-bg:#FFFFFF; --cta-ink:#0A0A0A; --arr-bg:#0A0A0A;
  --nav-bg:rgba(24,24,28,.86); --nav-line:rgba(255,255,255,.07); --nav-active-bg:#FFFFFF; --nav-active-ink:#0A0A0A;
  --island-line:rgba(255,255,255,.12);
  --shadow:none; --nav-shadow:none;
  --font-display:"Unbounded","Arial Black",sans-serif;
  --font-body:"Geist","Helvetica Neue",Arial,sans-serif;
  --hero-size:86px; --h1-size:32px; --title-size:22px;
  --display-weight:700; --title-weight:600; --display-track:-.045em; --title-track:-.02em;
  --focus:#5B8CFF; --future:#C27BFF; --body:#FF8A4C; --fuel:#3FD99A;
  --school:#FFD84D; --school-label:rgba(17,17,16,.62); --hl:rgba(255,255,255,.6);
  --tile-g:1;
  --tile-ink-o:#FFFFFF; --tile-muted-o:rgba(255,255,255,.8); --tile-label-o:rgba(255,255,255,.78); --tile-line-o:rgba(255,255,255,.4);
  --glow-opacity:.5;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;-webkit-font-smoothing:antialiased;
  transition:background-color .4s ease,color .4s ease}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}
.tabular{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.press{transition:transform .22s var(--ease-snappy),opacity .2s}
.press:active{transform:scale(.97)}

/* ---------- layout ---------- */
.screen{max-width:430px;margin:0 auto;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 116px)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack > *{animation:rise .5s var(--ease-morph) backwards}
.stack > *:nth-child(2){animation-delay:.04s}.stack > *:nth-child(3){animation-delay:.08s}
.stack > *:nth-child(4){animation-delay:.12s}.stack > *:nth-child(5){animation-delay:.16s}
.stack > *:nth-child(6){animation-delay:.2s}.stack > *:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

.label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.muted{color:var(--muted)}

/* ---------- top bars ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.date{font-size:13px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:99px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex-shrink:0}
.avatar{width:42px;height:42px;border-radius:99px;border:0;background:var(--cta-bg);color:var(--cta-ink);font-family:var(--font-display);font-weight:700;font-size:15px}
.subhead{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.subhead-title{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.page-title{font-family:var(--font-display);font-size:var(--h1-size);font-weight:var(--display-weight);letter-spacing:var(--display-track);line-height:1;margin-top:14px;text-wrap:balance}
.page-sub{color:var(--muted);font-size:14px;font-weight:500;margin-top:8px}

/* ---------- odometer ---------- */
.odo{display:inline-flex;line-height:1}
.odo-col{display:inline-block;height:1em;line-height:1em;overflow:hidden}
.odo-strip{display:flex;flex-direction:column;transition:transform .9s cubic-bezier(.2,.9,.15,1)}
.odo-strip > span{display:block;height:1em;text-align:center}
.odo-sep{display:inline-block;line-height:1em}

/* ---------- hero ---------- */
.hero{padding:16px 0 4px}
.hero-num{font-family:var(--font-display);font-weight:var(--display-weight);font-size:var(--hero-size);letter-spacing:var(--display-track);display:flex;align-items:flex-start;line-height:1}
.hero-pct{color:var(--accent);line-height:1em}
.hero-sub{margin-top:10px;font-size:16px;font-weight:500;color:var(--muted)}
.hero-sub b{color:var(--ink);font-weight:600}
.segs{display:flex;gap:5px;margin-top:18px}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--track);position:relative;overflow:hidden}
.segs i::after{content:"";position:absolute;inset:0;border-radius:99px;background:var(--seg);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease-morph)}
.segs i.on::after{transform:scaleX(1)}
.segs-meta{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--muted)}
.segs-meta b{color:var(--ink);font-weight:600}

/* ---------- tiles ---------- */
.tile{position:relative;isolation:isolate;overflow:hidden;display:block;width:100%;text-align:left;border:0;
  border-radius:30px;padding:20px;background:var(--surface);color:var(--tile-ink-o,var(--ink));box-shadow:var(--shadow)}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--area-g);opacity:var(--tile-g);transition:opacity .4s}
[data-area="focus"]{--area:var(--focus);--area-g:var(--g-focus)}
[data-area="future"]{--area:var(--future);--area-g:var(--g-future)}
[data-area="body"]{--area:var(--body);--area-g:var(--g-body)}
[data-area="fuel"]{--area:var(--fuel);--area-g:var(--g-fuel)}
[data-area="school"]{--area:var(--school);--area-g:var(--g-school)}
.tile[data-area="school"]{--tile-ink-o:#111110;--tile-muted-o:rgba(17,17,16,.62);--tile-label-o:var(--school-label);--tile-line-o:rgba(17,17,16,.12)}
.t-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tile-label-o,var(--area))}
.t-title{margin-top:8px;font-family:var(--font-display);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);line-height:1.08;text-wrap:balance}
.t-meta{margin-top:6px;font-size:13px;font-weight:500;color:var(--tile-muted-o,var(--muted))}
.t-orb{position:absolute;right:-34px;bottom:-34px;width:120px;height:120px;border-radius:50%;background:var(--area);opacity:.08;z-index:-1}
.btn-row{display:flex;gap:8px;align-items:center;margin-top:16px}
.cta{width:100%;height:52px;border:0;border-radius:999px;background:var(--cta-bg);color:var(--cta-ink);
  display:flex;align-items:center;justify-content:space-between;padding:0 7px 0 22px;font-weight:600;font-size:15px}
.cta .arr{width:38px;height:38px;border-radius:99px;background:var(--arr-bg);color:#fff;display:grid;place-items:center;transition:transform .3s var(--ease-snappy);flex-shrink:0}
.cta:active .arr{transform:translateX(4px)}
.ghost-btn{height:52px;padding:0 18px;border-radius:99px;border:1px solid var(--tile-line-o,var(--line));background:transparent;font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile.mini{padding:16px 16px 18px;border-radius:26px}
.mini-num{display:block;margin-top:14px;font-family:var(--font-display);font-weight:var(--display-weight);font-size:30px;letter-spacing:var(--title-track)}
.mini .t-meta{margin-top:4px}
.next{display:flex;align-items:center;gap:12px;padding:6px 4px}
.next .dot{width:8px;height:8px;border-radius:99px;background:var(--area);flex-shrink:0}
.next-title{flex:1;min-width:0;font-weight:600}
.done-state{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:600}
.done-state i{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;background:var(--tile-ink-o,var(--area));color:var(--surface);animation:pop .45s both}

/* ---------- tasks ---------- */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-rows:1fr;transition:grid-template-rows .34s cubic-bezier(.4,0,.2,1),opacity .3s}
.task.leaving{grid-template-rows:0fr;opacity:0}
.task-clip{min-height:0;overflow:hidden}
.task-body{position:relative;margin-bottom:8px;border-radius:22px;overflow:hidden}
.task-swipe{position:absolute;inset:0;background:var(--area);display:flex;align-items:center;padding-left:22px;color:#fff}
.task-fg{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border-radius:22px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .45s var(--ease-morph)}
.check{width:28px;height:28px;border-radius:99px;border:1.5px solid var(--faint);background:transparent;color:transparent;display:grid;place-items:center;flex-shrink:0;padding:0}
.task.checked .check,.task.leaving .check{background:var(--area);border-color:var(--area);color:#fff;animation:pop .42s both}
.task-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.task-title{font-weight:600;align-self:flex-start;background:linear-gradient(currentColor,currentColor) 0 55%/0% 1.5px no-repeat;transition:background-size .35s .05s,color .3s}
.task.checked .task-title,.task.leaving .task-title{background-size:100% 1.5px;color:var(--muted)}
.task-sub{font-size:12px;color:var(--muted)}
.task-sub i{display:inline-block;width:6px;height:6px;border-radius:9px;background:var(--area);margin-right:6px;vertical-align:1px}
.task-xp{font-size:12px;font-weight:700;color:var(--area)}
.hint{font-size:12px;color:var(--faint);text-align:center;margin-top:2px}
.wait-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}

/* ---------- lists / cards ---------- */
.row-card{display:block;width:100%;text-align:left;border:0;background:var(--surface);color:var(--ink);border-radius:26px;padding:18px 20px;box-shadow:var(--shadow)}
.row-card-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row-card-name{font-family:var(--font-display);font-size:22px;font-weight:var(--title-weight);letter-spacing:var(--title-track);line-height:1.1}
.lvl{font-family:var(--font-display);font-weight:var(--display-weight);font-size:26px;color:var(--area);letter-spacing:var(--title-track);display:flex;align-items:baseline;gap:6px}
.lvl small{font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.row-card-meta{margin-top:6px;font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:14px}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--fill,var(--accent));transform-origin:left;
  transition:width .7s var(--ease-morph),background-color .3s;animation:grow 1s var(--ease-morph) both}
@keyframes grow{from{transform:scaleX(0)}}
.status{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:99px;
  color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{--area:var(--ink);display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);
  background:transparent;font-size:13px;font-weight:600;color:var(--muted);transition:background-color .25s,border-color .25s,color .25s}
.chip i{width:8px;height:8px;border-radius:99px;background:var(--area)}
.chip.on{border-color:var(--area);color:var(--ink);background:color-mix(in srgb,var(--area) 12%,transparent)}
.chip.static{color:var(--ink)}

/* plan */
.plan-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.plan-bar{width:4px;align-self:stretch;border-radius:9px;background:var(--area)}
.plan-time{width:44px;flex-shrink:0;font-size:13px;color:var(--muted)}
.plan-title{flex:1;min-width:0;font-weight:600}
.plan-row.done .plan-title{color:var(--faint);text-decoration:line-through}
.plan-check{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;background:var(--area);color:#fff;flex-shrink:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:16px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);
  border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink);transition:background-color .3s,color .3s,border-color .3s}
.day small{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.day.on{background:var(--body);border-color:var(--body);color:#fff}
.day.on small{color:rgba(255,255,255,.85)}
.day.rest{opacity:.45}

/* skill path */
.path{display:flex;flex-direction:column;margin-top:6px}
.node{display:flex;gap:16px;position:relative;padding-bottom:24px}
.node::before{content:"";position:absolute;left:13px;top:32px;bottom:4px;width:2px;border-radius:2px;background:var(--track)}
.node.completed::before{background:var(--area)}
.node:last-child::before{display:none}
.node-dot{width:28px;height:28px;border-radius:99px;flex-shrink:0;display:grid;place-items:center;border:2px solid var(--line);background:var(--bg);color:#fff}
.node.completed .node-dot{background:var(--area);border-color:var(--area)}
.node.current .node-dot{border-color:var(--area);box-shadow:0 0 0 6px color-mix(in srgb,var(--area) 18%,transparent)}
.node.current .node-dot::after{content:"";width:10px;height:10px;border-radius:99px;background:var(--area);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.6);opacity:.6}}
.node-title{font-size:16px;font-weight:600;padding-top:4px}
.node.locked .node-title{color:var(--faint)}
.node-action{margin-top:12px;height:42px;padding:0 18px;border-radius:99px;border:0;background:var(--cta-bg);color:var(--cta-ink);font-weight:600;font-size:14px}

/* ich */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px}
.kv b{display:block;font-family:var(--font-display);font-size:22px;font-weight:var(--title-weight);letter-spacing:var(--title-track);line-height:1.1}
.kv span{display:block;margin-top:5px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.seg-ctl{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:99px;padding:4px;position:relative}
.seg-ctl button{height:40px;border:0;background:transparent;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.seg-ctl button.on{color:var(--ink)}
.seg-thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:99px;background:var(--surface);
  box-shadow:0 2px 10px rgba(0,0,0,.12);transition:transform .45s var(--ease-morph)}
.tl-row{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.tl-year{font-family:var(--font-display);font-weight:var(--title-weight);font-size:15px}
.tl-row.now .tl-year{color:var(--accent)}
.link-row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px 20px;border-radius:24px;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}

/* stepper */
.stepper{display:flex;align-items:center;gap:6px;flex-shrink:0}
.stepper button{width:32px;height:32px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;line-height:1;padding:0}

/* ---------- focus ---------- */
.focus{position:fixed;inset:0;z-index:50;max-width:430px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.focus > *{position:relative;z-index:1}
.focus > .focus-glow{position:absolute;z-index:0;width:520px;height:520px;left:50%;top:42%;border-radius:50%;background:var(--area-g);
  filter:blur(90px);opacity:var(--glow-opacity);transform:translate(-50%,-50%);animation:breathe 7s ease-in-out infinite;pointer-events:none}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.15)}}
.focus-top{display:flex;justify-content:space-between;align-items:center}
.focus-kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--area)}
.focus-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center}
.focus-title{font-family:var(--font-display);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);max-width:300px;line-height:1.1;text-wrap:balance}
.focus-time{font-family:var(--font-display);font-weight:var(--display-weight);font-size:52px;letter-spacing:var(--title-track);display:flex;align-items:center}
.focus-xp{font-size:13px;color:var(--muted);font-weight:500}
.focus-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btn-soft{height:58px;border-radius:99px;border:0;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-cta{height:58px;width:100%;border-radius:99px;border:0;background:var(--cta-bg);color:var(--cta-ink);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}

/* ---------- dynamic island ---------- */
.island{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:90;view-transition-name:island;
  display:flex;align-items:center;justify-content:center;min-height:38px;max-width:calc(100% - 32px);
  background:#0A0A0A;color:#fff;border:1px solid var(--island-line);border-radius:999px;padding:0 14px;
  transform:translateX(-50%) scale(.4);opacity:0;pointer-events:none;
  transition:transform .5s cubic-bezier(.2,1,.3,1),opacity .25s,border-radius .45s,padding .45s}
.island.toast,.island.live{transform:translateX(-50%) scale(1);opacity:1;padding:8px 16px 8px 10px}
.island.live{pointer-events:auto;cursor:pointer}
.island.big{transform:translateX(-50%) scale(1);opacity:1;border-radius:34px;padding:18px 36px}
.island-row{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;white-space:nowrap;animation:islandIn .4s .12s both}
.island-dot{width:10px;height:10px;border-radius:99px;flex-shrink:0}
.island-sub{font-size:12px;font-weight:500;color:rgba(255,255,255,.6)}
.island-live-title{max-width:140px;overflow:hidden;text-overflow:ellipsis}
.island-big{display:flex;flex-direction:column;align-items:center;gap:4px;animation:islandIn .4s .15s both}
.island-kicker{font-size:10px;font-weight:700;letter-spacing:.2em;color:#FF6A3D}
.island-level{font-family:"Unbounded","Arial Black",sans-serif;font-size:52px;font-weight:700;letter-spacing:-.04em}
@keyframes islandIn{from{opacity:0;transform:translateY(4px)}}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet-scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);animation:fade .3s both}
.sheet{position:relative;width:100%;max-width:430px;background:var(--surface);border-radius:32px 32px 0 0;
  padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 24px);animation:sheetUp .5s var(--ease-morph) both}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sheet-grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 18px}
.sheet-title{font-family:var(--font-display);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);margin-bottom:14px}
.field{width:100%;height:56px;border-radius:18px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 18px;font-size:16px;outline:none;transition:border-color .2s}
.field:focus{border-color:var(--ink)}

/* ---------- snap meal ---------- */
.snap-drop{aspect-ratio:1;max-width:100%;border-radius:30px;border:1.5px dashed var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.snap-drop .t-title{margin-top:4px}
.ai-status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:7px 12px;margin-top:6px}
.dot{width:8px;height:8px;border-radius:99px;flex-shrink:0;background:var(--faint)}
.photo{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--surface-2)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo-badge{position:absolute;left:12px;bottom:12px;font-size:10px;font-weight:700;letter-spacing:.12em;padding:6px 10px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff}
.scan-line{position:absolute;left:0;right:0;height:2px;background:#fff;box-shadow:0 0 18px 4px rgba(255,255,255,.7);animation:scan 1.5s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes scan{from{top:4%}to{top:96%}}
.pipe-arrow{display:flex;justify-content:center;color:var(--faint);margin:2px 0;animation:fade .3s both}
.pipe-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px 18px;box-shadow:var(--shadow);animation:rise .45s var(--ease-morph) both;transition:border-color .3s}
.pipe-card.active{border-color:var(--focus)}
.pipe-card.error{border-color:var(--body)}
.pipe-head{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.pipe-head .dot.active{background:var(--focus);animation:blink .9s ease-in-out infinite}
.pipe-head .dot.done{background:var(--fuel)}
.pipe-head .dot.error{background:var(--body)}
@keyframes blink{50%{opacity:.25}}
.pipe-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:15px;font-weight:500;animation:slideIn .4s var(--ease-morph) both}
.pipe-row + .pipe-row{border-top:1px solid var(--line)}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}}
.src-badge{font-size:10px;font-weight:700;letter-spacing:.1em;padding:5px 9px;border-radius:99px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.thinking{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 2px}
.thinking span{font-size:14px;font-weight:600;color:var(--focus);animation:blink 1.4s ease-in-out infinite}
.result-num{font-family:var(--font-display);font-weight:var(--display-weight);font-size:58px;letter-spacing:var(--display-track);display:flex;align-items:baseline;gap:8px;line-height:1}
.result-num small,.result-pro small{font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.result-pro{font-family:var(--font-display);font-weight:var(--title-weight);font-size:28px;letter-spacing:var(--title-track);color:var(--focus);display:flex;align-items:baseline;gap:8px;margin-top:8px;line-height:1}
.approx{font-family:var(--font-body);font-weight:400;color:var(--faint);font-size:.5em}
.budget{height:10px;border-radius:99px;background:var(--track);overflow:hidden;display:flex;margin-top:18px}
.budget i{display:block;height:100%;transition:width .6s var(--ease-morph)}
.fineprint{font-size:11px;color:var(--faint);text-align:center;line-height:1.5}

/* ---------- school + calendar ---------- */
.lessons{margin-top:12px}
.lesson-row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--tile-line-o,var(--line));font-size:14px;transition:opacity .3s}
.lesson-row.past{opacity:.42}
.lesson-row.now{font-weight:700}
.lr-time,.lr-room{font-size:12px;color:var(--tile-muted-o,var(--muted))}
.hl{background:linear-gradient(transparent 58%, var(--hl) 58%);padding:0 2px;margin:0 -2px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:currentColor;margin-left:8px;vertical-align:2px;animation:blink 1.2s ease-in-out infinite}
.event-row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.event-when{min-width:74px;font-size:12px;font-weight:700;color:var(--focus);line-height:1.3}
.event-title{font-weight:600}
.event-sub{font-size:12px;color:var(--muted);margin-top:2px}
.note{font-size:13px;color:var(--muted);line-height:1.5;padding:12px 14px;border-radius:16px;background:var(--surface-2)}
.note button{border:0;background:none;padding:0;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.weeknav .wk{font-weight:700;text-align:center}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayb{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 13px;border-radius:18px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:700;font-size:16px;transition:background-color .3s,color .3s,border-color .3s}
.dayb small{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);transition:color .3s}
.dayb.on{background:var(--cta-bg);color:var(--cta-ink);border-color:var(--cta-bg)}
.dayb.on small{color:inherit;opacity:.7}
.dayb.today:not(.on) small{color:var(--accent)}
.dayb i{position:absolute;bottom:5px;width:4px;height:4px;border-radius:9px;background:var(--faint)}
.dayb.on i{background:currentColor}
.tline{display:grid;grid-template-columns:48px 4px 1fr auto;gap:12px;align-items:stretch;padding:10px 0;transition:opacity .3s}
.tline.past{opacity:.45}
.tl-time{display:flex;flex-direction:column;font-size:13px;line-height:1.35}
.tl-time b{font-weight:700}
.tl-time span{color:var(--muted);font-size:12px}
.tl-bar{border-radius:9px;background:var(--area)}
.tline.now .tl-bar{box-shadow:0 0 0 4px color-mix(in srgb,var(--area) 25%,transparent)}
.tl-title{font-weight:700;font-size:16px}
.tl-sub{font-size:12px;color:var(--muted);margin-top:3px}
.live-pill{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--accent);color:#fff;vertical-align:2px}

/* ---------- view transitions ---------- */
::view-transition-old(root),::view-transition-new(root){animation-duration:var(--dur-state);animation-timing-function:var(--ease-snappy)}
html[data-vt="forward"]::view-transition-old(root){animation-name:vt-out-left}
html[data-vt="forward"]::view-transition-new(root){animation-name:vt-in-right;animation-duration:var(--dur-morph);animation-timing-function:var(--ease-morph)}
html[data-vt="back"]::view-transition-old(root){animation-name:vt-out-right}
html[data-vt="back"]::view-transition-new(root){animation-name:vt-in-left;animation-duration:var(--dur-morph);animation-timing-function:var(--ease-morph)}
html[data-vt="tab"]::view-transition-old(root){animation-name:vt-fade-out;animation-duration:.2s}
html[data-vt="tab"]::view-transition-new(root){animation-name:vt-rise}
html[data-vt="zoom"]::view-transition-old(root){animation-name:vt-zoom-out}
html[data-vt="zoom"]::view-transition-new(root){animation-name:vt-zoom-in}
html[data-vt="theme"]::view-transition-old(root){animation:none}
html[data-vt="theme"]::view-transition-new(root){animation:vt-reveal .75s cubic-bezier(.65,0,.25,1)}
html[data-vt="theme"]::view-transition-group(*){animation-duration:.75s}
@keyframes vt-out-left{to{opacity:0;transform:translateX(-18%)}}
@keyframes vt-in-right{from{transform:translateX(100%)}}
@keyframes vt-out-right{to{opacity:0;transform:translateX(25%) scale(.96)}}
@keyframes vt-in-left{from{opacity:0;transform:translateX(-18%)}}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-rise{from{opacity:0;transform:translateY(14px)}}
@keyframes vt-zoom-out{to{opacity:0;transform:scale(.94)}}
@keyframes vt-zoom-in{from{opacity:0;transform:scale(1.06)}}
@keyframes vt-reveal{from{clip-path:circle(0 at var(--vt-x,50%) var(--vt-y,50%))}to{clip-path:circle(150vmax at var(--vt-x,50%) var(--vt-y,50%))}}

/* ---------- NICO OS v2: ruhige Zeilen statt Karten ---------- */
.hero-colon{opacity:.35;margin:0 .02em;line-height:1em}
.wx{font-weight:500;color:var(--faint)}
.change-line{display:inline-flex;align-items:center;gap:8px;margin-top:14px;border:0;background:none;padding:0;color:var(--ink);font-size:14px;font-weight:500;text-align:left}
.change-line b{color:var(--fuel);font-weight:700}
.pulse-dot{width:8px;height:8px;border-radius:99px;background:var(--school);flex-shrink:0;box-shadow:0 0 0 0 var(--school);animation:ping 2s var(--ease-snappy) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--school) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.tbar{height:3px;border-radius:9px;background:var(--tile-line-o,var(--track));margin-top:14px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:9px;background:var(--tile-ink-o,var(--area));transition:width 1s var(--ease-snappy)}
.t-hint{margin-top:12px;font-size:14px;line-height:1.45;color:var(--tile-ink-o,var(--ink))}
.cta-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.next-block{padding:4px 2px}
.next-row{display:flex;align-items:center;gap:14px;margin-top:8px}
.next-time{font-family:var(--font-display);font-weight:var(--display-weight);font-size:28px;letter-spacing:var(--title-track);color:var(--area);min-width:84px}
.next-name{font-family:var(--font-display);font-weight:var(--title-weight);font-size:20px;letter-spacing:var(--title-track);line-height:1.15}
.arow{display:grid;grid-template-columns:48px 3px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);transition:opacity .3s}
.arow:last-child{border-bottom:0}
.arow-time{font-size:13px;font-weight:600;color:var(--muted)}
.arow-bar{align-self:stretch;border-radius:9px;background:var(--area);min-height:26px}
.arow-main{display:flex;flex-direction:column;gap:2px;min-width:0;border:0;background:none;padding:0;text-align:left;color:inherit}
.arow-main:disabled{opacity:1;cursor:default}
.arow-title{font-weight:600;font-size:15px}
.arow-sub{font-size:12px;color:var(--muted)}
.arow.past{opacity:.4}
.arow.free .arow-bar{background:transparent;border-left:2px dashed var(--fuel);border-radius:0;width:0;justify-self:center}
.arow.free .arow-title{color:var(--fuel);font-weight:600}
.arow.cancelled .arow-title{text-decoration:line-through;color:var(--muted)}
.arow.cancelled .arow-bar{opacity:.35}
.arow.suggested .arow-bar{background:repeating-linear-gradient(180deg,var(--area) 0 5px,transparent 5px 9px)}
.flag{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--school);color:#111110;vertical-align:2px;text-decoration:none}
.arow-start{width:36px;height:36px;border-radius:99px;border:0;background:var(--cta-bg);color:var(--cta-ink);display:grid;place-items:center;flex-shrink:0;padding:0}
.free-line{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;border:0;background:none;padding:10px 0 4px;text-align:left;color:inherit}
.free-num{font-family:var(--font-display);font-weight:var(--display-weight);font-size:clamp(34px,11vw,48px);letter-spacing:var(--display-track);line-height:1.02;color:var(--fuel)}
.free-sub{font-size:12px;color:var(--muted)}
.line-row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"label end" "main end";column-gap:12px;row-gap:4px;align-items:center;width:100%;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit;cursor:pointer}
.line-row.static{cursor:default}
.line-row > .label{grid-area:label;color:var(--area,var(--muted))}
.line-row > .line-main{grid-area:main;font-weight:500;font-size:15px;line-height:1.4;min-width:0}
.line-row > :last-child:not(.line-main):not(.label){grid-area:end}
.line-big{font-family:var(--font-display);font-weight:var(--display-weight);font-size:20px;letter-spacing:var(--title-track)}
.done-mark{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;background:var(--future);color:#fff}
.mini-btn{width:32px;height:32px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;flex-shrink:0}
.progress-line{display:block;width:100%;border:0;background:none;padding:6px 0 0;text-align:left;color:inherit}
.progress-line .segs{margin-top:0}
.disc{border-top:1px solid var(--line)}
.disc-head{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 0;border:0;background:none;color:inherit}
.disc-meta{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.disc-chev{display:grid;transition:transform .35s var(--ease-snappy)}
.disc.open .disc-chev{transform:rotate(180deg)}
.disc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease-snappy)}
.disc.open .disc-body{grid-template-rows:1fr}
.disc-inner{min-height:0;overflow:hidden}
.disc.open .disc-inner{padding-bottom:12px}
.plan-summary{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 10px}
.plan-free{font-family:var(--font-display);font-weight:var(--display-weight);font-size:30px;letter-spacing:var(--title-track);color:var(--fuel);margin-top:4px}
.plan-free span{font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted)}
.plan-facts{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--muted);text-align:right}
.plan-facts .pos{color:var(--fuel);font-weight:700}
.agenda{margin-top:4px}
.plan-row .check{width:26px;height:26px}
button.plan-check{border:0;padding:0}
.sheet-actions{display:flex;flex-direction:column;gap:10px}
.sheet-actions .btn-soft,.sheet-actions .btn-cta{height:52px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:500}
.time-in{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font-size:15px}
.link-list{display:flex;flex-direction:column}
.conn{border-bottom:1px solid var(--line)}
.conn-head{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;width:100%;padding:16px 0;border:0;background:none;color:inherit;text-align:left}
.conn-name{font-weight:600}
.conn-status{font-size:13px;color:var(--muted);text-align:right}
.conn-dot{width:10px;height:10px;border-radius:99px;background:var(--faint)}
.conn-dot[data-s="on"]{background:var(--fuel)}
.conn-dot[data-s="warn"]{background:var(--school)}
.conn-dot[data-s="wait"]{background:var(--focus);animation:blink 1s ease-in-out infinite}
.conn-body{padding:0 0 16px 22px;font-size:14px;line-height:1.5;color:var(--muted);display:flex;flex-direction:column;gap:6px;animation:rise .35s var(--ease-snappy) both}
.conn-body b{color:var(--ink);font-weight:600}
.hist-row{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist-date{display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.hist-date b{color:var(--ink);font-size:15px}
.hist-line{font-weight:600}
.hist-sub{font-size:12px;color:var(--muted);margin-top:2px}
.digital-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.big-dur{font-family:var(--font-display);font-weight:var(--display-weight);font-size:clamp(26px,8vw,36px);letter-spacing:var(--title-track);margin-top:6px;line-height:1.05}
.meal-row{padding:12px 0;border-bottom:1px solid var(--line)}
.meal-item{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:6px}
.pbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.pbar{display:flex;flex-direction:column;align-items:center;gap:4px}
.pbar-track{position:relative;width:100%;height:88px;border-radius:10px;background:var(--track);overflow:hidden;display:flex;align-items:flex-end}
.pbar-track i{display:block;width:100%;background:var(--focus);border-radius:10px;opacity:.55;transition:height .8s var(--ease-snappy)}
.pbar.today .pbar-track i{opacity:1}
.pbar-goal{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--muted)}
.pbar-val{font-size:11px;font-weight:600}
.pbar-day{font-size:10px;color:var(--muted);font-weight:600}

/* ---------- NICO AI ---------- */
.ai-title{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:var(--title-weight);font-size:18px;letter-spacing:var(--title-track)}
.ai-state{font-size:12px;font-weight:600;color:var(--muted);min-width:42px;text-align:right}
.ai-state.on{color:var(--fuel)}
.ai-empty .page-title{font-size:clamp(36px,11vw,52px)}
.ai-list{display:flex;flex-direction:column;gap:14px;padding-top:10px}
.msg{max-width:88%;animation:rise .35s var(--ease-snappy) both}
.msg.user{align-self:flex-end;background:var(--surface-2);padding:10px 14px;border-radius:20px 20px 6px 20px}
.msg.assistant{align-self:flex-start;max-width:100%}
.msg-text{white-space:pre-wrap;line-height:1.55;font-size:15px}
.msg.assistant .msg-text{font-size:16px}
.msg.err .msg-text{color:var(--muted)}
.msg-img{display:block;max-width:100%;width:200px;border-radius:14px;margin-bottom:6px}
.msg-file{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.msg-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.receipt{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--fuel) 14%,transparent);color:var(--fuel);animation:pop .35s var(--ease-snappy) both}
.typing{display:inline-flex;gap:5px;padding:8px 0}
.typing i{width:7px;height:7px;border-radius:99px;background:var(--muted);animation:blink 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.ai-quick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.ai-quick::-webkit-scrollbar{display:none}
.ai-quick .chip{flex-shrink:0;color:var(--ink)}
.ai-input{display:flex;align-items:flex-end;gap:8px;padding:6px;border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.ai-input textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;color:var(--ink);font-size:16px;line-height:1.35;padding:10px 4px;max-height:120px;outline:none;font-family:inherit}
.ai-btn,.ai-send{width:42px;height:42px;border-radius:99px;border:0;display:grid;place-items:center;flex-shrink:0;padding:0}
.ai-btn{background:transparent;color:var(--muted)}
.ai-btn.rec{background:var(--body);color:#fff;animation:ping 1.4s infinite}
.ai-send{background:var(--cta-bg);color:var(--cta-ink)}
.ai-preview{position:relative;display:inline-block;margin-bottom:8px}
.ai-preview img{width:72px;height:72px;object-fit:cover;border-radius:14px;display:block}
.ai-preview .mini-btn{position:absolute;top:-8px;right:-8px;background:var(--surface)}

@keyframes vt-fade-in{from{opacity:0}}
.island-text{max-width:240px;white-space:normal;line-height:1.3}


/* =========================================================
   KINETIC EDITORIAL MINIMALISM
   Stand = ruhig. Bewegung = Verbindung zwischen Zuständen.
   Orange = Energie/Körper/NICO · Blau = Fortschritt/AI/Skills
   Violett = Zukunft · Grün = erledigt/Bewegung
   ========================================================= */
main.vt-nav .stack > *{animation:none}

/* ---------- shared elements ---------- */
::view-transition-group(*){animation-duration:var(--dur-morph);animation-timing-function:var(--ease-morph)}
::view-transition-old(*.bar-morph),::view-transition-new(*.bar-morph){height:100%}
::view-transition-image-pair(*.line-morph){overflow:hidden}
::view-transition-old(*.line-morph),::view-transition-new(*.line-morph){height:100%;object-fit:none}
::view-transition-old(*.txt),::view-transition-new(*.txt){animation-duration:calc(var(--dur-morph) * .45)}
html[data-vt="morph"]::view-transition-new(*.txt):only-child,html[data-vt="morph-back"]::view-transition-new(*.txt):only-child{animation:vt-fade-in var(--dur-state) ease 160ms both}
html[data-vt="morph"]::view-transition-old(*.txt):only-child,html[data-vt="morph-back"]::view-transition-old(*.txt):only-child{animation:vt-fade-out var(--dur-micro) ease both}
/* Live-Bereiche: bleiben während des Übergangs echt, eigene CSS-Bewegung läuft sichtbar weiter */
html[data-vt]::view-transition-group(*.live){animation:none}
html[data-vt]::view-transition-old(*.live){display:none}
html[data-vt]::view-transition-new(*.live){animation:none}
@keyframes vt-emerge{from{opacity:0;transform:scale(.97)}}
@keyframes vt-recede{to{opacity:0;transform:scale(.94)}}

/* Liste -> Detail (Skills, Projekte, Level) */
html[data-vt="morph"]::view-transition-old(root),html[data-vt="morph-back"]::view-transition-old(root){animation:vt-fade-out var(--dur-micro) ease both}
html[data-vt="morph"]::view-transition-new(root){animation:vt-fade-in var(--dur-state) ease 140ms both}
html[data-vt="morph-back"]::view-transition-new(root){animation:vt-fade-in var(--dur-state) ease 120ms both}
@keyframes row-out-down{to{opacity:0;transform:translateY(40px)}}
@keyframes row-out-up{to{opacity:0;transform:translateY(-32px)}}
@keyframes row-in-down{from{opacity:0;transform:translateY(40px)}}
@keyframes row-in-up{from{opacity:0;transform:translateY(-32px)}}
::view-transition-old(*.list-row):only-child{animation:row-out-down var(--dur-state) var(--ease-snappy) both}
::view-transition-old(*.up):only-child{animation-name:row-out-up}
::view-transition-new(*.list-row):only-child{animation:row-in-down var(--dur-morph) var(--ease-morph) both}
::view-transition-new(*.up):only-child{animation-name:row-in-up}
::view-transition-old(*.sel):only-child{animation:vt-fade-out 120ms linear both}
::view-transition-new(*.sel):only-child{animation:vt-fade-in var(--dur-state) ease 260ms both}
::view-transition-old(*.d1):only-child,::view-transition-new(*.d1):only-child{animation-delay:40ms}
::view-transition-old(*.d2):only-child,::view-transition-new(*.d2):only-child{animation-delay:80ms}
::view-transition-old(*.d3):only-child,::view-transition-new(*.d3):only-child{animation-delay:120ms}
::view-transition-old(*.d4):only-child,::view-transition-new(*.d4):only-child{animation-delay:160ms}
::view-transition-old(*.d5):only-child,::view-transition-new(*.d5):only-child{animation-delay:200ms}
main:not(.vt-nav) .xrow{animation:rise var(--dur-morph) var(--ease-morph) backwards}
main:not(.vt-nav) .xrow:nth-child(2){animation-delay:40ms}main:not(.vt-nav) .xrow:nth-child(3){animation-delay:80ms}
main:not(.vt-nav) .xrow:nth-child(4){animation-delay:120ms}main:not(.vt-nav) .xrow:nth-child(n+5){animation-delay:160ms}

/* ---------- NICO AI Kern ---------- */
.ai-core{position:relative;isolation:isolate;display:grid;place-items:center;width:46px;height:46px;border-radius:99px;color:#fff;
  transition:width var(--dur-state) var(--ease-snappy),height var(--dur-state) var(--ease-snappy)}
.ai-core::before{content:"";position:absolute;inset:-3px;z-index:-2;border-radius:inherit;opacity:.55;filter:blur(4px);
  background:radial-gradient(circle at 28% 30%,#FF6A3D 0 26%,transparent 58%),radial-gradient(circle at 76% 38%,#8B5CFF 0 24%,transparent 56%),radial-gradient(circle at 46% 82%,#3B6BFF 0 24%,transparent 56%);
  animation:aura 16s linear infinite;will-change:transform}
.ai-core::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--core);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
@keyframes aura{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.07)}100%{transform:rotate(360deg) scale(1)}}
.ai-core.sm{width:28px;height:28px}
.ai-core.sm::before{inset:-3px;filter:blur(3px);animation:none;opacity:.6}

/* ---------- NICO AI Screen: Kern wird zum Chat ---------- */
.ai-screen{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;height:100dvh;background:var(--bg)}
.ai-wrap{width:100%;max-width:430px;margin:0 auto;padding:0 20px}
.ai-head{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  animation:ai-in var(--dur-morph) var(--ease-morph) 180ms both}
.ai-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ai-scroll > .ai-wrap{padding-bottom:18px}
.ai-dock{flex-shrink:0;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg);animation:ai-in var(--dur-morph) var(--ease-morph) 240ms both}
.ai-dock > .ai-wrap{padding:0 16px}
.ai-empty{padding:12vh 0 20px;animation:ai-in var(--dur-sig) var(--ease-soft) 220ms both}
@keyframes ai-in{from{opacity:0;transform:translateY(14px)}}
::view-transition-group(n-ai-core){animation-duration:var(--dur-sig);animation-timing-function:var(--ease-morph)}
html[data-vt="aiback"]::view-transition-group(n-ai-core){animation-duration:var(--dur-morph)}
::view-transition-image-pair(n-ai-core){overflow:hidden;border-radius:0}
html[data-vt="ai"]::view-transition-image-pair(n-ai-core){animation:ai-shape var(--dur-sig) var(--ease-morph) both}
html[data-vt="aiback"]::view-transition-image-pair(n-ai-core){animation:ai-shape-back var(--dur-morph) var(--ease-morph) both}
@keyframes ai-shape{0%{border-radius:23px;background-color:var(--core)}30%{background-color:var(--bg)}55%{border-radius:30px}100%{border-radius:0;background-color:var(--bg)}}
@keyframes ai-shape-back{0%{border-radius:0;background-color:var(--bg)}45%{border-radius:30px}75%{background-color:var(--bg)}100%{border-radius:23px;background-color:var(--core)}}
::view-transition-old(n-ai-core),::view-transition-new(n-ai-core){height:100%;object-fit:none;overflow:clip}
html[data-vt="ai"]::view-transition-old(n-ai-core){animation:vt-fade-out 140ms linear both}
html[data-vt="ai"]::view-transition-new(n-ai-core){animation:vt-fade-in 260ms ease 170ms both}
html[data-vt="aiback"]::view-transition-old(n-ai-core){animation:vt-fade-out 200ms linear both}
html[data-vt="aiback"]::view-transition-new(n-ai-core){animation:vt-fade-in 140ms ease 320ms both}
html[data-vt="ai"]::view-transition-old(root){animation:vt-recede var(--dur-sig) var(--ease-morph) both}
html[data-vt="ai"]::view-transition-new(root){animation:vt-fade-in var(--dur-sig) ease both}
html[data-vt="aiback"]::view-transition-old(root){animation:vt-fade-out var(--dur-state) ease both}
html[data-vt="aiback"]::view-transition-new(root){animation:vt-emerge var(--dur-morph) var(--ease-morph) 60ms both}

/* Navigation bleibt stehen – nur der Indikator gleitet. Bei AI/Fokus zieht sie sich zurück. */
html[data-vt]::view-transition-group(nav){animation:none}
html[data-vt]::view-transition-old(nav){display:none}
html[data-vt]::view-transition-new(nav){animation:none}
html[data-vt="theme"]::view-transition-old(nav){display:block;animation:vt-fade-out .5s ease both}
html[data-vt="theme"]::view-transition-new(nav){animation:vt-fade-in .5s ease both}
html[data-vt="ai"]::view-transition-old(nav),html[data-vt="zoom"]::view-transition-old(nav){display:block;animation:nav-out var(--dur-state) var(--ease-snappy) both}
html[data-vt="aiback"]::view-transition-new(nav),html[data-vt="zoom"]::view-transition-new(nav){animation:nav-in var(--dur-morph) var(--ease-morph) 200ms both}
@keyframes nav-out{to{opacity:0;transform:translateY(calc(100% + 28px))}}
@keyframes nav-in{from{opacity:0;transform:translateY(calc(100% + 28px))}}

/* ---------- typografische Listen ---------- */
.xlist{display:flex;flex-direction:column;margin-top:10px}
.xrow{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:18px 0 16px}
.xrow:last-child{border-bottom:1px solid var(--line)}
.xrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.xrow-name{font-family:var(--font-display);font-size:clamp(24px,7.2vw,30px);font-weight:var(--title-weight);letter-spacing:var(--title-track);line-height:1.05;display:inline-block}
.xrow-lvl{display:flex;align-items:baseline;gap:6px;flex-shrink:0}
.xrow-lvl small,.skill-hero small{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.lvl-num{display:inline-block;font-family:var(--font-display);font-weight:var(--display-weight);font-size:26px;letter-spacing:var(--title-track);line-height:1;color:var(--focus)}
.xrow-meta{margin-top:6px;font-size:13px;color:var(--muted)}
.xrow .bar{height:3px;margin-top:14px}
.skill-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:22px}
.skill-hero .lvl-num{font-size:clamp(92px,28vw,120px);letter-spacing:var(--display-track);margin-top:4px}
.skill-xp{text-align:right;padding-bottom:10px;font-size:13px;color:var(--muted)}
.skill-xp b{display:block;font-family:var(--font-display);font-size:26px;font-weight:var(--title-weight);letter-spacing:var(--title-track);color:var(--ink)}
.path{position:relative}
.path-spine{position:absolute;left:13px;top:14px;bottom:38px;width:2px;border-radius:2px;background:var(--track);overflow:hidden}
.path-spine i{position:absolute;left:0;right:0;top:0;height:var(--p,0%);border-radius:2px;background:var(--focus);transition:height var(--dur-sig) var(--ease-soft)}
.node{animation:node-in var(--dur-morph) var(--ease-morph) backwards;animation-delay:calc(200ms + var(--i,0) * 70ms)}
@keyframes node-in{from{opacity:0;transform:translateY(12px)}}
.node-dot{position:relative;z-index:1;transition:background-color var(--dur-state) ease,border-color var(--dur-state) ease}
.node.completed .node-dot{background:var(--focus);border-color:var(--focus)}
.node.current .node-dot{border-color:var(--focus);box-shadow:none}
.node.current .node-dot::after{background:var(--focus);animation:none}
.node-dot svg path{stroke-dasharray:24;stroke-dashoffset:0}
.proj-row{display:grid;grid-template-columns:8px 1fr;column-gap:14px;align-items:start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:18px 0 16px}
.proj-row:last-child{border-bottom:1px solid var(--line)}
.proj-edge{display:block;width:8px;height:8px;border-radius:99px;background:var(--c);margin-top:12px}
.proj-status{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;font-weight:600;color:var(--c);text-transform:lowercase}
.proj-next{margin-top:4px;font-size:14px;color:var(--muted);line-height:1.4}
.proj-hero{display:grid;grid-template-columns:3px 1fr;column-gap:16px;margin-top:10px}
.proj-edge-line{display:block;width:3px;border-radius:3px;background:var(--c);align-self:stretch}
.proj-hero .page-title{margin-top:0}
.proj-block{padding:8px 0 4px;border-top:1px solid var(--line)}
.proj-block-text{margin-top:10px;font-family:var(--font-display);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);line-height:1.14;text-wrap:balance}

/* ---------- Level ---------- */
.lvl-hit{display:block;width:100%;border:0;background:none;padding:0;text-align:left;color:inherit}
.xp-total{display:inline-block}
.bar.thick{height:14px;margin-top:20px}
.level-num{font-size:clamp(132px,44vw,184px)!important;color:var(--accent)}
.xp-chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:132px;margin-top:12px}
.xp-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.xp-col i{display:block;width:100%;border-radius:8px;background:var(--accent);opacity:.3;transform-origin:bottom;animation:col-grow var(--dur-sig) var(--ease-soft) backwards;animation-delay:calc(260ms + var(--i,0) * 45ms)}
.xp-col.today i{opacity:1}
.xp-col b{font-size:11px;font-weight:600}
.xp-col span{font-size:10px;font-weight:600;color:var(--muted)}
@keyframes col-grow{from{transform:scaleY(0)}}

/* ---------- Plan: Tage bewegen sich ---------- */
.daystrip{position:relative}
.day-ind{position:absolute;top:0;bottom:0;left:0;z-index:0;width:calc((100% - 36px) / 7);border-radius:18px;background:var(--cta-bg);
  transform:translateX(calc(var(--sel,0) * (100% + 6px)));transition:transform var(--dur-morph) var(--ease-morph);pointer-events:none}
.dayb{z-index:1;background:transparent;border-color:transparent}
.dayb.on{background:transparent;border-color:transparent}
html[data-vt^="day"]::view-transition-old(root),html[data-vt^="day"]::view-transition-new(root),
html[data-vt="cancel"]::view-transition-old(root),html[data-vt="cancel"]::view-transition-new(root),
html[data-vt="state"]::view-transition-old(root),html[data-vt="state"]::view-transition-new(root){animation-duration:var(--dur-micro)}
::view-transition-image-pair(*.arow){overflow:hidden}
@keyframes arow-in-r{from{opacity:0;transform:translateX(32px)}}
@keyframes arow-in-l{from{opacity:0;transform:translateX(-32px)}}
@keyframes arow-collapse{to{opacity:0;transform:scaleY(.15)}}
@keyframes arow-open{from{opacity:0;transform:scaleY(.2)}}
::view-transition-old(*.arow):only-child{animation:arow-collapse var(--dur-state) var(--ease-snappy) both;transform-origin:top}
::view-transition-new(*.arow):only-child{animation:arow-open var(--dur-morph) var(--ease-morph) 90ms both;transform-origin:top}

html[data-vt="day-back"]::view-transition-new(*.arow):only-child{animation:arow-in-l var(--dur-morph) var(--ease-morph) 70ms both}
@keyframes pop-in{from{opacity:0;transform:translateY(8px) scale(.96)}}
::view-transition-new(*.pop):only-child{animation:pop-in var(--dur-sig) var(--ease-soft) 260ms both}
.arow.cancelled{padding:4px 0}
.arow.cancelled .arow-bar{min-height:12px}
.arow.cancelled .arow-title{font-size:13px;font-weight:500}
.arow.cancelled .arow-sub{display:none}
.arow.done .arow-bar{background:var(--fuel)}
.arow.done .arow-title{color:var(--muted)}
.free-pill{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;
  background:color-mix(in srgb,var(--fuel) 14%,transparent);color:var(--fuel);vertical-align:2px}
.plan-delta{display:inline-block}

/* ---------- Heute ---------- */
.tile.now{box-shadow:none;border-radius:0;margin:6px -20px;width:calc(100% + 40px);padding:22px 20px 24px;background:color-mix(in srgb,var(--area,var(--accent)) 7%,var(--bg))}
.stack > .hero.intro{animation:none}
.hero.intro > *{animation:intro-up var(--dur-sig) var(--ease-soft) both}
.hero.intro > :nth-child(1){animation-delay:40ms}

.hero.intro > :nth-child(3){animation-delay:220ms}
.hero.intro > :nth-child(4){animation-delay:300ms}
@keyframes intro-up{from{opacity:0;transform:translateY(16px)}}
@keyframes intro-num{from{opacity:0;transform:translateY(34px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(-10% -10% -10% -10%)}}
.task-body{border-radius:0}
.task-swipe{border-radius:14px;background:var(--fuel)}
.task-fg{background:var(--bg);border-radius:0;padding:12px 2px;border-bottom:1px solid var(--line)}
.task:last-child .task-fg{border-bottom:0}
.check svg path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset var(--dur-state) var(--ease-snappy) 60ms}
.task.checked .check,.task.leaving .check{background:var(--fuel);border-color:var(--fuel);animation:check-press var(--dur-state) var(--ease-snappy) both}
.task.checked .check svg path,.task.leaving .check svg path{stroke-dashoffset:0}
@keyframes check-press{45%{transform:scale(.84)}}
.task-title{transform-origin:left center;transition:background-size var(--dur-state) 60ms,color var(--dur-state),letter-spacing var(--dur-state) var(--ease-snappy),transform var(--dur-state) var(--ease-snappy)}
.task.checked .task-title,.task.leaving .task-title{letter-spacing:-.02em;transform:scaleX(.97)}
.task-xp{transition:color var(--dur-state)}
.task.checked .task-xp,.task.leaving .task-xp{color:var(--fuel)}
.done-line{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:600;color:var(--tile-ink-o,var(--fuel))}
.done-line .ck{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;background:var(--fuel);color:#fff;flex-shrink:0}
.done-line .ck svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw var(--dur-state) var(--ease-snappy) 240ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bar > i{animation:none;transition:width var(--dur-sig) var(--ease-soft),background-color .3s}

/* ---------- Navigation: leicht, in den Screen integriert ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:16px 10px calc(env(safe-area-inset-bottom,0px) + 8px);
  background:linear-gradient(to top,var(--bg) 62%,transparent);view-transition-name:nav;
  transition:padding var(--dur-state) var(--ease-snappy)}
.nav-in{position:relative;max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n),1fr);align-items:end}
.nav-item,.nav-ai{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:54px;padding:0 0 2px;border:0;background:none;
  color:var(--faint);transition:color var(--dur-state) ease,height var(--dur-state) var(--ease-snappy)}
.nav-item svg{stroke-width:1.6;transition:stroke-width var(--dur-state) ease}

  transition:opacity var(--dur-state) ease,max-height var(--dur-state) var(--ease-snappy)}
.nav-ai{color:var(--muted)}

.nav-ind{position:absolute;left:0;bottom:-7px;width:calc(100% / var(--n));height:3px;display:flex;justify-content:center;pointer-events:none;
  transition:transform var(--dur-morph) var(--ease-morph)}
.nav-ind i{display:block;width:18px;height:3px;border-radius:3px;background:var(--accent)}
.nav.compact{padding-top:10px}
.nav.compact .nav-item,.nav.compact .nav-ai{height:34px;gap:0}
.nav.compact .nav-label{max-height:0;opacity:0}
.nav.compact .nav-ai .ai-core{width:32px;height:32px}
.nav.compact .nav-ind{bottom:-5px}

/* ---------- HEUTE: Hero + Day Flow ---------- */
:root{--dh-size:74px}
:root[data-theme="dark"]{--dh-size:46px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--dh-size:46px}}
.day-hero{padding:22px 0 4px}

const { useState, useEffect, useLayoutEffect, useReducer, useRef, useCallback } = React;

/* ================= icons ================= */

/* ================= helpers ================= */
const WEEKDAYS=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MONTHS=["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sept.","Okt.","Nov.","Dez."];
function pad2(n){ return String(n).padStart(2,"0"); }
function todayISO(d=new Date()){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function formatDate(d=new Date()){ return `${WEEKDAYS[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}`; }
function greeting(d=new Date()){ const h=d.getHours(); return h<11?"Guten Morgen":h<17?"Hey":"Guten Abend"; }
function fmtMin(min){ const h=Math.floor(min/60), m=min%60; return h>0?`${h} h ${m} min`:`${m} min`; }
function makeId(p="id"){ return `${p}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`; }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function de(n){ return Number(n).toLocaleString("de-DE"); }
function haptic(ms=8){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function reducedMotion(){ try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }

const AREA_LABEL={focus:"Fokus", body:"Körper", future:"Zukunft", fuel:"Fuel", school:"Schule"};
function areaOf(item){ return item.area || (item.kind==="gym" ? "body" : "focus"); }
const SKILL_AREA={ai:"focus", editing:"future", englisch:"fuel", marketing:"body", backflip:"body"};
const SKILL_CYCLE=["focus","future","body","fuel"];
function skillArea(skill, i){ return SKILL_AREA[skill.id] || SKILL_CYCLE[i % SKILL_CYCLE.length]; }

/* ================= theme ================= */
const THEME_KEY="nico-os-theme";
const HOST_THEME=document.documentElement.getAttribute("data-theme");
function loadThemePref(){ try{ return localStorage.getItem(THEME_KEY) || "auto"; }catch(e){ return "auto"; } }
function saveThemePref(p){ try{ localStorage.setItem(THEME_KEY, p); }catch(e){} }
function applyTheme(pref){
  const root=document.documentElement;
  if(pref==="light" || pref==="dark") root.setAttribute("data-theme", pref);
  else if(HOST_THEME) root.setAttribute("data-theme", HOST_THEME);
  else root.removeAttribute("data-theme");
}
function resolvedTheme(){
  const a=document.documentElement.getAttribute("data-theme");
  if(a==="light" || a==="dark") return a;
  try{ return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }catch(e){ return "light"; }
}
applyTheme(loadThemePref());
if(!document.documentElement.lang) document.documentElement.lang="de";

/* =========================================================
   MOTION SYSTEM · Kinetic Editorial Minimalism
   Ruhe im Stand, Bewegung als Verbindung zwischen Zuständen.
   - Shared Elements: View Transitions (gleicher Name = dasselbe Element, morpht zur neuen Position)
   - Springs: physikalisch simuliert, als CSS linear()-Kurven (Fallback: cubic-bezier)
   - Timings: micro 180 · state 280 · morph 480 · signature 650 ms
   ========================================================= */
const MOTION={micro:180, state:280, morph:480, signature:650};
function springCurve(stiffness, damping, mass=1){
  let x=0, v=0, t=0;
  const dt=1/600, pts=[[0,0]];
  while(t<2){
    const a=(-stiffness*(x-1) - damping*v)/mass;
    v+=a*dt; x+=v*dt; t+=dt;
    pts.push([t,x]);
    if(t>.08 && Math.abs(x-1)<.0015 && Math.abs(v)<.02) break;
  }
  const T=t, n=40, out=[];
  for(let i=0;i<=n;i++){
    const target=T*i/n;
    const p=pts.reduce((best,q)=>Math.abs(q[0]-target)<Math.abs(best[0]-target) ? q : best, pts[0]);
    out.push(i===n ? 1 : Math.round(p[1]*1000)/1000);
  }
  return {easing:`linear(${out.join(", ")})`, ms:Math.round(T*1000)};
}
(function installMotionTokens(){
  try{
    if(!(window.CSS && CSS.supports && CSS.supports("animation-timing-function","linear(0, 1)"))) return;
    const root=document.documentElement.style;
    const morph=springCurve(230, 29), snappy=springCurve(380, 38), soft=springCurve(150, 24);
    root.setProperty("--ease-morph", morph.easing);
    root.setProperty("--ease-snappy", snappy.easing);
    root.setProperty("--ease-soft", soft.easing);
    root.setProperty("--dur-morph", `${clamp(morph.ms, 380, 600)}ms`);
    root.setProperty("--dur-state", `${clamp(snappy.ms, 220, 350)}ms`);
    root.setProperty("--dur-sig", `${clamp(soft.ms, 520, 780)}ms`);
  }catch(e){}
})();
function canTransition(){
  return typeof document.startViewTransition==="function" && !reducedMotion() && document.visibilityState==="visible";
}
/* Shared Element: gleicher Name in zwei Zuständen = ein Element, das sich verwandelt */
function vtSlug(s){
  return String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "x";
}
function vt(name, cls){
  const st={viewTransitionName:`n-${vtSlug(name)}`};
  if(cls) st.viewTransitionClass=cls;
  return st;
}
/* Haptik: Web-Vibration heute, echte iOS-Haptik über Capacitor später */
const Haptics={
  native(){ return nativePlugin("Haptics"); },
  impact(style){
    const p=this.native();
    if(p){ try{ p.impact({style}); }catch(e){} return; }
    haptic(style==="HEAVY" ? 22 : style==="MEDIUM" ? 14 : 8);
  },
  light(){ this.impact("LIGHT"); },
  medium(){ this.impact("MEDIUM"); },
  success(){
    const p=this.native();
    if(p){ try{ p.notification({type:"SUCCESS"}); }catch(e){} return; }
    haptic([18,40,24]);
  },
};
/* Sichtbarkeit: Fortschritt animiert erst, wenn er im Bild ist */
function useInView(){
  const ref=useRef(null);
  const [seen,setSeen]=useState(()=>typeof IntersectionObserver==="undefined");
  useEffect(()=>{
    if(seen || !ref.current) return;

const CAL_RETRACT=["needs_reauth","server_not_connected","server_not_found","selection_required","not_in_manifest","not_granted","blocked_by_policy","approval_required","capability_disabled","capability_removed"];
function useCalendar(fromISO, days, enabled=true){
  const [cal,setCal]=useState({status:"loading", events:[]});
  const [nonce,setNonce]=useState(0);
  useEffect(()=>{
    if(!enabled){ setCal({status:"disabled", events:[]}); return; }
    let alive=true, unsub=null;
    MCP_READY.then(mcp=>{
      if(!alive) return;
      if(!mcp){ setCal({status:"unavailable", events:[]}); return; }
      const start=dateFromISO(fromISO);
      const input={startTime:toLocalISO(start), endTime:toLocalISO(addDays(start, days)), orderBy:"startTime", pageSize:250, timeZone:TZ};
      try{
        unsub=mcp.watchTool(CAL_SERVER, "list_events", input, ev=>{
          if(!alive) return;
          if(ev.type==="data"){
            const r=ev.result || {};
            setCal({status:"ok", events:parseEvents(r.payload), stale:false, syncedAt: r.cache ? r.cache.storedAt : Date.now()});
          } else {
            const err=ev.error || {};
            setCal(prev=> (!CAL_RETRACT.includes(err.code) && prev.status==="ok")
              ? {...prev, stale:true}
              : {status:"error", code:err.code, message:err.message, events:[]});
          }
        }, {refetchInterval: 5*60*1000, cache:{staleTime:60*1000}});
      }catch(e){ setCal({status:"error", code:"bad_request", events:[]}); }
    });
    return ()=>{ alive=false; if(unsub) unsub(); };
  },[fromISO, days, nonce, enabled]);
  function reload(){
    MCP_READY.then(mcp=>{ if(mcp) return mcp.invalidate(CAL_SERVER, "list_events").catch(()=>{}); }).then(()=>setNonce(n=>n+1));
  }
  return {...cal, reload};
}

    <p className="note">
      {cal.stale ? `Kalender gerade nicht erreichbar · Stand ${cal.syncedAt ? hhmm(new Date(cal.syncedAt)) : "vorhin"}. ` : msg}

const STEPS_RE=/(\d{1,3}(?:[.\s]\d{3})+|\d+)\s*(?:schritte|steps)\b/i;

function stepsFromEvents(events, day){
  let best=null;

    const m=(e.title || "").match(STEPS_RE);

    const n=Number(m[1].replace(/[.\s]/g, ""));
    if(Number.isFinite(n) && n>=0 && n<200000 && (best===null || n>best)) best=n;
  }
  return best;
}

        ref.current=next; setData(next); setStatus("ok"); writeJSON(WEATHER_KEY, next);
      }catch(e){
        if(alive) setStatus(ref.current ? "stale" : "blocked");
      }
    }
    load();
    const id=setInterval(load, 30*60000);
    return ()=>{ alive=false; clearInterval(id); };
  },[enabled]);
  return {data, status};
}

/* In der Web-App: Hinweise in der Island, solange NICO OS offen ist.

const NOTIF_KEY="nico-os-notified";

  m.body={...seed.body, ...(s.body || {}), stepsSource:(s.body && s.body.stepsSource) || "manual"};
  m.queue=(s.queue || seed.queue).map(q=>({...q, area:areaOf(q),
    durationMin: q.id==="q-gym" && q.durationMin===60 ? 120 : q.id==="q-editing" && q.durationMin===24 ? 30 : q.durationMin}));
  m.skills=(s.skills || seed.skills).map(k=>({...k, sessions:Array.isArray(k.sessions) ? k.sessions : []}));
  m.digital={...seed.digital, ...(s.digital || {}), source:(s.digital && s.digital.source) || "demo"};
  m.events=Array.isArray(s.events) ? s.events : [];
  m.schoolChanges=Array.isArray(s.schoolChanges) ? s.schoolChanges : [];
  m.gymPlan=s.gymPlan || {};

  m.focusLog=Array.isArray(s.focusLog) ? s.focusLog : [];
